[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/paulocorcino/ralphy"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
include_dir = "0.7"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
indicatif = "0.18"
console = "0.16"
ureq = { version = "3", features = ["json"] }
directories = "6"
toml = "1.1"
rusqlite = { version = "0.41", features = ["bundled"] }
ulid = "1"
semver = "1"
sha2 = "0.10"
# `deflate-flate2`, not `deflate`: `deflate` turns on flate2's zlib-rs backend,
# and features are shared, so the daemon's note containers would change backend
# too (`note::tests::a_container_carries_no_plaintext` pins miniz_oxide) (#443).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
tempfile = "3"
os_info = { version = "3", default-features = false }
winresource = "0.1"

ralphy-core = { path = "crates/ralphy-core" }
ralphy-agent-claude = { path = "crates/ralphy-agent-claude" }
ralphy-agent-codex = { path = "crates/ralphy-agent-codex" }
ralphy-agent-copilot = { path = "crates/ralphy-agent-copilot" }
ralphy-agent-cursor = { path = "crates/ralphy-agent-cursor" }
ralphy-agent-gemini = { path = "crates/ralphy-agent-gemini" }
ralphy-agent-kimi = { path = "crates/ralphy-agent-kimi" }
ralphy-agent-opencode = { path = "crates/ralphy-agent-opencode" }
ralphy-pty = { path = "crates/ralphy-pty" }
ralphy-adapter-support = { path = "crates/ralphy-adapter-support" }
ralphy-proc-util = { path = "crates/ralphy-proc-util" }
ralphy-git-read = { path = "crates/ralphy-git-read" }
ralphy-run-snapshot = { path = "crates/ralphy-run-snapshot" }
ralphy-daemon = { path = "crates/ralphy-daemon" }
ralphy-usage-scan = { path = "crates/ralphy-usage-scan" }
ralphy-pricing = { path = "crates/ralphy-pricing" }
ralphy-release = { path = "crates/ralphy-release" }
ralphy-telegram = { path = "crates/ralphy-telegram" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The gate's profile: `release` optimization without `release` link cost.
#
# `lto`/`codegen-units = 1` above are a *ship* cost, paid once for the one
# binary `release.yml` builds. The test job compiles the whole workspace's ~50
# test binaries, and `ralphy-cli`'s integration tests each link the entire CLI —
# under thin LTO with a single codegen unit that crate alone took ~20 minutes,
# which is what wedged the test job into its `timeout-minutes` bound on both
# runners. Optimization is what the tests actually need (the daemon's PBKDF2
# path, see the note below), so keep opt-level and drop only the link-time work.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Build *dependencies* optimized even in dev/test, while the workspace crates
# stay at opt-level 0 so our own edit-compile loop stays fast. Dependencies are
# compiled once and cached, so this costs one rebuild and nothing after.
#
# The daemon's password path is PBKDF2-HMAC-SHA1 at 1.3M iterations
# (`password.rs`), so its tests pay that cost for real and unoptimized crypto
# makes them the slowest tests in the workspace. Measured on the full suite:
# `password::tests::hash_round_trips_through_string` 32.2s -> 20.1s,
# `auth::tests::session_login_requires_password_when_set` 32.9s -> 20.8s,
# whole run 133.6s -> 123.5s.
[profile.dev.package."*"]
opt-level = 3
