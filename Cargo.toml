[workspace]
resolver = "2"
members = [
    "crates/ralphy-core",
    "crates/ralphy-cli",
    "crates/ralphy-agent-claude",
    "crates/ralphy-agent-codex",
    "crates/ralphy-agent-copilot",
    "crates/ralphy-agent-cursor",
    "crates/ralphy-agent-gemini",
    "crates/ralphy-agent-kimi",
    "crates/ralphy-agent-opencode",
    "crates/ralphy-pty",
    "crates/ralphy-adapter-support",
    "crates/ralphy-proc-util",
    "crates/ralphy-git-read",
    "crates/ralphy-run-snapshot",
    "crates/ralphy-daemon",
    "crates/ralphy-usage-scan",
    "crates/ralphy-pricing",
    "crates/ralphy-release",
    "crates/ralphy-telegram",
    "crates/xtask",
]

# Every `unsafe` block sits under a named `expect` that says which FFI it
# wraps (ADR-0072 D13).
[workspace.lints.rust]
unsafe_code = "deny"
non_ascii_idents = "deny"
# The lint gate: `rust_2018_idioms` is on. A lint `allow` below is debt that
# docs/lint/lint-transition.md turns on (this list only shrinks).
rust_2018_idioms = { level = "deny", priority = -1 }
# debt: 101 sites
elided_lifetimes_in_paths = "allow"

# The error rules of AGENTS.md, checked by clippy. The settings of
# `disallowed_methods` and `too_many_arguments` are in `clippy.toml`.
[workspace.lints.clippy]
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
disallowed_methods = "deny"
too_many_arguments = "deny"
# The lint gate: `pedantic` is on. A lint `allow` below is debt that docs/lint/lint-transition.md
# turns on (this list only shrinks), or noise, off for good with its reason.
pedantic = { level = "deny", priority = -1 }
# noise: docs on the public API of a published library only; no crate here is published (D3)
missing_errors_doc = "allow"
# noise: fires on every pure function; #[must_use] goes where ignoring the value is a bug (D3)
must_use_candidate = "allow"
