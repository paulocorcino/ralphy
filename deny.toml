# cargo-deny policy for the workspace. CI runs `cargo deny check` in
# .github/workflows/security.yml; run the same command locally before you add
# or update a dependency.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, including `unmaintained` and
# `unsound`. An exception needs an entry here with the reason. An entry that
# matches no crate in Cargo.lock fails the check too: delete it.
unused-ignored-advisory = "deny"
ignore = []

[licenses]
# Every license here can be combined with the workspace's GPL-3.0-or-later.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# A second version of a crate fails the check. The duplicates of today are in
# `skip`, each with the upstream release that removes it. CI also denies
# `unmatched-skip`, `unmatched-skip-root` and `unnecessary-skip`, so an entry
# whose duplicate is gone fails the check too: delete it. This list only shrinks.
multiple-versions = "deny"
skip = [
    { crate = "bitflags@1.3.2", reason = "portable-pty 0.9.0 (latest); a portable-pty release on bitflags 2" },
    { crate = "nix@0.28.0", reason = "portable-pty 0.9.0 (latest); a portable-pty release on nix 0.31" },
    { crate = "cfg_aliases@0.1.1", reason = "nix 0.28 of portable-pty; goes with nix@0.28.0" },
    { crate = "thiserror@1.0.69", reason = "filedescriptor of portable-pty 0.9.0; a portable-pty release" },
    { crate = "thiserror-impl@1.0.69", reason = "goes with thiserror@1.0.69" },
    { crate = "getrandom@0.3.4", reason = "rand 0.9 of tungstenite 0.29 and ulid 1; the axum chain in #443" },
    { crate = "r-efi@5.3.0", reason = "goes with getrandom@0.3.4" },
    { crate = "getrandom@0.2.17", reason = "ring 0.17.14 (latest); a ring release on getrandom 0.3 or later" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17.14 (latest), aarch64 Windows only; a ring release" },
    { crate = "windows-sys@0.59.0", reason = "alacritty_terminal =0.26.0 (pinned, ADR-0079); its next release" },
    { crate = "windows-sys@0.60.2", reason = "file-id 0.2.3 (latest) of notify-debouncer-full; a file-id release" },
    { crate = "base64@0.22.1", reason = "axum 0.8.9, alacritty_terminal and swc; ureq 3 is on 0.23" },
    { crate = "syn@2.0.119", reason = "proc-macros of swc, icu and others; each moves to syn 3 on its own" },
    { crate = "hashbrown@0.14.5", reason = "hstr of swc (build only); an swc release" },
    { crate = "rand@0.8.8", reason = "phf_generator 0.11 of swc (build only); an swc release" },
    { crate = "rand_core@0.6.4", reason = "goes with rand@0.8.8" },
]
# windows-sys 0.61 uses windows-link, so every windows-targets version is old.
skip-tree = [
    { crate = "windows-targets@0.52.6", depth = 2, reason = "windows-sys 0.52 and 0.59 above" },
    { crate = "windows-targets@0.53.5", depth = 2, reason = "windows-sys 0.60 above" },
]
# The workspace crates depend on each other by path, with no version, and
# Cargo.lock pins every crates.io version. A wildcard adds no risk here.
wildcards = "allow"
# One WebSocket stack: the peer client shares tungstenite with axum's `ws`
# feature. A second version means axum moved; that pull request is where the
# peer client, then ulid 3, then the RustCrypto group move (#443).
deny = [
    { crate = "tungstenite", deny-multiple-versions = true, reason = "axum moved to a new tungstenite; move the peer client in the same pull request, then follow the chain in #443" },
]

[sources]
# A dependency comes from crates.io only. A git dependency or another registry
# fails the check, so it cannot enter the tree without a change to this file.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
