        <div class="canvas-tools" x-data="wbConsoleMenus" x-show="$store.tabs.active === 'consoles'">
          <!-- Consoles: pick an agent → spawns a floating console for the
               selected repo ($store.projects.openSlug), or the home dir if none. impl: this is
               where a real session/PTY is launched (agent × repo), like the
               daemon's /ws/session. -->
          <div class="menu-wrap">
            <!-- `.btn-label` is the word a phone drops (05-workspace.css); the
                 title and aria-label keep it for the finger and the reader. -->
            <!-- Plain `.btn`, chevron like its siblings: the three toolbar
                 buttons are all menus and read as one row of equals. -->
            <button class="btn" @click.stop="toggleAgentMenu()" title="Open a console" aria-label="Consoles">
              <!-- Bootstrap's terminal, not lucide's square-terminal: the tab
                   renders `t.icon` as a class, so this is the only glyph the
                   two can literally share. -->
              <i class="bi bi-terminal"></i> <span class="btn-label">Consoles</span> <svg x-icon="'chevron-down'"></svg>
            </button>
            <div class="dropdown console-menu" x-show="agentMenu" @click.outside="agentMenu = false; closeConsoleRun()" x-cloak>
              <!-- The bare repo name and the accelerator pattern, once. The
                   owner and the environment are the sidebar's; the prefix
                   never varies, so each row below carries only its digit
                   (the Fence menu's rule). -->
              <div class="dropdown-head" :title="$store.projects.openSlug ? $store.projects.projectTitle($store.projects.openSlug) : ''">
                <span x-text="$store.projects.openSlug ? consoleMenuRepoName() : 'Home (no project open)'"></span>
                <kbd class="kbd" x-text="consoleShortcutHint()"></kbd>
              </div>
              <p class="side-error" x-show="$store.projects.sessionsError()" x-text="$store.projects.sessionsError()"></p>
              <!-- The daemon's adapter roster folded against the live sessions
                   (wb-agents.js), plain console last. Every row LAUNCHES — the
                   live count is a readout; reaching a window is the Go-to
                   menu's job. The plain row also carries "Run…": it turns the
                   row into a command field for ONE console (Alt+Shift+R). -->
              <template x-for="it in consoleItems()" :key="it.digit">
                <div class="console-choice" :class="{ 'is-console-choice': it.digit === '0' }"
                     x-show="!(it.digit === '0' && consoleRunOpen)">
                  <button class="dropdown-item" :class="{ 'is-console': it.plain, unavailable: it.unavailable }"
                          :disabled="it.disabled"
                          :title="it.title"
                          @click="openConsoleItem(it)">
                    <i class="bi" :class="it.plain ? 'bi-terminal-fill' : 'bi-terminal'"></i>
                    <span x-text="it.label"></span>
                    <span class="row-live" x-show="it.live > 0" x-text="it.live + ' live'"></span>
                    <kbd class="kbd" x-text="it.digit"></kbd>
                  </button>
                  <button class="row-try" x-show="it.tryAnyway"
                          @click.stop="openConsoleItem(it, { tryAnyway: true })"
                          :title="it.title">Try anyway</button>
                  <button class="row-run" x-show="it.digit === '0'"
                          @click.stop="openConsoleRun()"
                          title="Open a console that runs a command"
                          aria-label="Run a command in a new console">Run… <kbd class="kbd">R</kbd></button>
                </div>
              </template>
              <!-- Outside the loop, so exactly one element owns the ref. The
                   plain row is last, so the field takes its place. -->
              <div class="console-run" x-show="consoleRunOpen">
                <input type="text" x-ref="consoleRun" x-model="consoleRunText"
                       autocomplete="off" spellcheck="false"
                       placeholder="Command, for example htop"
                       aria-label="Command to run in a new console"
                       @keydown.enter.prevent="runConsoleCommand()"
                       @keydown.escape.prevent.stop="closeConsoleRun()">
                <span class="console-run-hint">Enter opens a console.</span>
                <span class="console-run-hint">Esc cancels.</span>
              </div>
            </div>
          </div>
          <!-- Go to: the plane is bigger than the viewport, so a window can sit
               entirely off-view. One click on a row centres it (issue #337,
               ADR-0051 §4). The rows are `.window-item`, NOT `.dropdown-item`:
               every existing query scoped to the New-console menu must stay
               inert.

               PARKED, not deleted: with the fence list acting as the map, a
               flat roster of every console earns no toolbar slot today. The
               markup, `toggleWindowMenu`/`revealWindow` and their tests stay
               live behind the inline `display:none` — drop the style to bring
               the button back. -->
          <div class="menu-wrap" style="display: none">
            <button class="btn" @click.stop="toggleWindowMenu()" title="Show a console">
              <i class="bi bi-crosshair"></i> Go to
            </button>
            <div class="dropdown window-menu" x-show="windowMenu" @click.outside="windowMenu = false" x-cloak>
              <div class="dropdown-head" x-text="windowList.length ? 'Consoles on the stage' : 'No consoles yet'"></div>
              <template x-for="w in windowList" :key="w.id">
                <button class="window-item" @click="revealWindow(w.id)">
                  <i class="bi bi-terminal"></i>
                  <span x-text="window.WBConsoleName.consoleLabel(w.name || '', w.agent)" :title="w.tooltip"></span>
                  <span class="session-state" :class="w.state" x-show="w.state" :title="window.WBConsole?.agentStateTitle(w.state, w.detail)"></span>
                  <span class="row-off" x-show="!w.running">not running</span>
                </button>
              </template>
            </div>
          </div>
          <!-- Fence: ONE button for the whole concept. Creating a fence (a
               DELIBERATE act — nothing auto-creates one, and it is never bound
               to a project: issue #340, ADR-0051 §6) is the menu's first row,
               and the fences on the plane follow it, because the list IS the
               map (issue #343, ADR-0051 §7): one click slides the viewport to
               that fence and focuses it, so the next console is born inside it.
               Two toolbar buttons for one noun made the operator learn which of
               them held which verb; this is the same shape `Consoles`
               already uses. Rows stay `.fence-item`, a third class beside
               `.window-item`, so queries scoped to either existing menu stay
               inert. -->
          <div class="menu-wrap">
            <button class="btn" @click.stop="toggleFenceMenu()" title="Draw a fence, or jump to one" aria-label="Fence">
              <i class="bi bi-bounding-box"></i> <span class="btn-label">Fence</span> <svg x-icon="'chevron-down'"></svg>
            </button>
            <div class="dropdown fence-menu" x-show="fenceMenu" @click.outside="fenceMenu = false" x-cloak>
              <button class="fence-item fence-new" :title="fenceCapReason()"
                      :disabled="fenceAtCap()"
                      @click="newFence()">
                <i class="bi bi-plus-square"></i>
                <span class="row-name">New fence</span>
              </button>
              <!-- The accelerator pattern is stated ONCE, here, and each row below
                   carries only its own number. Spelling `Alt+Shift+` on every row
                   crowded the panel out of shape: the prefix never varies, so the
                   menu was paying its width twelve times over and the name beside
                   it wrapped mid-word. -->
              <div class="dropdown-head">
                <span x-text="fenceItems.length ? 'Fences on the stage' : 'No fences yet'"></span>
                <kbd class="kbd" x-show="fenceItems.length" x-text="fenceShortcutHint()"></kbd>
              </div>
              <!-- Name + accelerator, nothing else: the repo list and the
                   console count read as noise HERE (the fence's own head already
                   carries the count, and a jump is chosen by name), while the
                   key that reaches this fence without the menu is the one thing
                   the row can teach. The fold still computes both — see
                   `fenceSummaries` — so restoring either readout is a markup
                   change, not a rewrite. -->
              <template x-for="(f, i) in fenceItems" :key="f.id">
                <button class="fence-item" @click="jumpFence(f.id)">
                  <i class="bi bi-bounding-box"></i>
                  <span class="row-name" x-text="f.name"></span>
                  <!-- Every row carries one: the key range (F1..F12) is the fence
                       cap, so there is no row left without an accelerator. -->
                  <kbd class="kbd" x-text="fenceShortcutLabel(i + 1)"></kbd>
                </button>
              </template>
            </div>
          </div>
          <!-- Note: the same ONE-button shape as Fence, for the same reason
               (ADR-0064 §9). Creating a note has no dialog — the row makes a
               card in the middle of the view, empty, and the first autosave
               names its file. The map of notes on the plane follows in §10. -->
          <div class="menu-wrap">
            <button class="btn" @click.stop="toggleNoteMenu()" title="Write a note on the stage" aria-label="Note">
              <i class="bi bi-sticky"></i> <span class="btn-label">Note</span> <svg x-icon="'chevron-down'"></svg>
            </button>
            <div class="dropdown note-menu" x-show="noteMenu" @click.outside="noteMenu = false" x-cloak>
              <button class="note-item note-new" :title="noteCapReason()"
                      :disabled="noteAtCap() || !$store.projects.openSlug"
                      @click="newNote()">
                <i class="bi bi-plus-square"></i>
                <span class="row-name">New note</span>
              </button>
              <div class="dropdown-head">
                <span x-text="noteItems.length ? 'Notes on the stage' : 'No notes yet'"></span>
              </div>
              <!-- The list IS the map (ADR-0064 §10), as the fence list is:
                   the row jumps the viewport to the card. Moving inside a
                   note is the card's own index, not this menu's. -->
              <template x-for="n in noteItems" :key="n.id">
                <div class="note-row">
                  <button class="note-item" @click="jumpNote(n.id)">
                    <span class="note-dot" :data-tone="n.tone"></span>
                    <span class="row-name" x-text="n.title"></span>
                    <span class="note-fence" x-text="n.fence" x-show="n.fence"></span>
                    <!-- Keep on top (ADR-0064, 2026-09-26 amendment): lit while
                         this card floats; refused for a card in a popup. -->
                    <span class="note-top" :class="{ on: n.onTop, off: n.away }"
                          :title="n.away ? 'This note is in a detached window' : (n.onTop ? 'Put back' : 'Keep on top')"
                          @click.stop="toggleOnTop(n)"><i class="bi" :class="n.onTop ? 'bi-pin-fill' : 'bi-pin-angle'"></i></span>
                  </button>
                </div>
              </template>
            </div>
          </div>
        </div>
