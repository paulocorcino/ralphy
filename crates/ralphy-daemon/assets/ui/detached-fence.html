<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Same keyboard behaviour as the shell: this popup paints consoles too. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>Ralphy · detached fence</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" sizes="any" />
    <!-- same vendored styles as the shell, so the consoles look identical -->
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="vendor/devicon/devicon.min.css" />
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="styles/01-base.css" />
    <link rel="stylesheet" href="styles/02-rail-sidebar.css" />
    <link rel="stylesheet" href="styles/03-runs.css" />
    <link rel="stylesheet" href="styles/04-canvas.css" />
    <link rel="stylesheet" href="styles/05-workspace.css" />
    <link rel="stylesheet" href="styles/06-consoles.css" />
    <link rel="stylesheet" href="styles/07-viewers.css" />
    <link rel="stylesheet" href="styles/08-modals.css" />
    <link rel="stylesheet" href="styles/09-branch.css" />
    <link rel="stylesheet" href="styles/10-kanban.css" />
    <link rel="stylesheet" href="styles/11-appended.css" />
    <link rel="stylesheet" href="styles/12-spend.css" />
    <!-- The note editor's own stylesheet, BEFORE the card's: `13-notes.css`
         sets the `--crepe-*` tokens that theme it (ADR-0064 §6). -->
    <link rel="stylesheet" href="vendor/crepe/crepe.css" />
    <link rel="stylesheet" href="styles/13-notes.css" />
    <style>
      /* this window IS the plane — fill it */
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
      }
      #workspace {
        position: fixed;
        inset: 0;
        overflow: auto;
      }
      /* The window's two buttons, in the bottom-right corner: no console
         control is there, and the top edge holds every title bar. Above
         every window (`focusWin` stacks them no higher than 120), below a
         card on top (125). */
      .detached-tools {
        position: fixed;
        bottom: 8px;
        right: 18px;
        z-index: 124;
        display: flex;
        gap: 0.3rem;
        /* Faint over the console text it sits on, whole under the pointer
           or the keyboard. */
        opacity: 0.45;
        transition: opacity 0.2s ease;
      }
      .detached-tools:hover,
      .detached-tools:focus-within {
        opacity: 1;
      }
      .detached-tools button {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text-muted);
        line-height: 1;
        padding: 0.2rem 0.4rem;
        cursor: pointer;
      }
      .detached-tools button:hover {
        border-color: var(--border-focus);
        color: var(--text);
      }
      .detached-tools .detached-note {
        color: var(--note-ochre);
      }
      /* Both are for a larger screen: a phone paints one console, and a card
         on top there is a band over it. The query is the workbench's phone
         breakpoint (app.js `PHONE_QUERY`). */
      @media (max-width: 560px), (pointer: coarse) and (max-height: 560px) {
        .detached-tools {
          display: none;
        }
      }
      .detached-empty,
      .detached-lost {
        color: var(--danger);
        font-family: ui-monospace, monospace;
        padding: 1.2rem;
      }
    </style>
  </head>
  <body>
    <!-- The very ids `wb-console.js` resolves for the viewport and the plane, so
         this popup REUSES the consoles module rather than re-implementing it. -->
    <div id="workspace"><div id="stage"></div></div>

    <script type="module" src="detached-fence-main.js"></script>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/xterm-addon-fit.js"></script>
    <script src="vendor/xterm-addon-webgl.js"></script>
    <script src="vendor/xterm-addon-web-links.js"></script>
    <script src="wb-desk-sink.js"></script>
    <script src="wb-desk-sync.js"></script>
    <script src="wb-detach-link.js"></script>
    <!-- A page script, not a module: `wb-console.js` reads `WBConsoleOpts`
         while the page is parsed, and a module runs after every classic
         script. -->
    <script>
      // Where this window will talk. `"*"` would broadcast this fence's contents
      // to whatever opened us, so the concrete origin is both the
      // confidentiality control and the authentication one: only the shell can
      // hear us, and only the shell can answer.
      const PEER = window.location.origin;

      // The backend seam lives in the opener; forward every intent there over
      // postMessage, so a detached fence is indistinguishable from an in-shell one.
      window.WB = {
        emit(action, detail) {
          if (window.opener) window.opener.postMessage({ type: "wb-emit", action, detail }, PEER);
          else console.log("[workbench:action]", { action, ...detail });
        },
      };

      // THE FIVE CAPABILITIES THIS DOCUMENT DENIES ITSELF. This popup holds a
      // FRAGMENT of the plane — one fence's members — so a desk write from here
      // would replace the operator's whole layout with that fragment, and a view
      // write would clobber the shell's stored viewport offset. The detach
      // registry is the fifth: `window.open` handed this document a COPY of its
      // opener's session storage, so a registry read here answers with a ghost
      // that drifts the moment the real tab writes. Denying them by INJECTION
      // rather than by a `detached` test at each call site is what makes the
      // popup incapable rather than merely careful.
      window.WBConsoleOpts = {
        deskSink: window.WBDeskSink.none(),
        viewStore: { read: () => null, patch: () => null },
        autoBoot: false,
        canLaunch: false,
        detachLink: window.WBDetachLink.none(),
      };
    </script>
    <script src="wb-geometry.js"></script>
    <script src="wb-console-name.js"></script>
    <script src="wb-window-state.js"></script>
    <script src="wb-console.js"></script>
    <!-- The note card rides into a detached fence (ADR-0064 §8), so the popup
         builds one exactly as the shell does. -->
    <!-- A ```mermaid fence in a note DRAWS (ADR-0064 §15), in the popup as on
         the stage: the node view inside `crepe.js` reads these two globals,
         and the sanitizer is the same one the file viewer uses. -->
    <script src="vendor/dompurify.min.js"></script>
    <script src="vendor/mermaid.min.js"></script>
    <script src="vendor/crepe/crepe.js"></script>
    <script src="wb-notes.js"></script>
  </body>
</html>
