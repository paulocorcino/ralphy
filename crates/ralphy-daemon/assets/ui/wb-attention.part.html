      <div class="menu-wrap rail-attention" x-data="wbAttention" :class="{ 'menu-open': open }">
        <button :class="{ active: open }" @click.stop="toggle()" title="Requests that wait for you">
          <svg x-icon="'bell'"></svg>
          <span class="attention-badge" x-show="count() > 0" x-text="count()" x-cloak></span>
        </button>
        <div class="dropdown attention-panel" x-show="open" @click.outside="close()" x-cloak
             role="region" aria-label="Requests that wait for you">
          <p class="attention-empty" x-show="count() === 0">Nothing waits for you.</p>
          <template x-for="r in requests" :key="r.id">
            <div class="attention-row">
              <button class="attention-main" type="button" :disabled="actionOf(r) === 'none'"
                      :title="actionTitle(r)" @click="act(r)">
                <span class="dot" :class="dotOf(r)"></span>
                <span class="attention-text">
                  <span class="attention-line">
                    <span class="attention-name" x-text="nameOf(r)"></span>
                    <span class="attention-age" x-text="ageOf(r)"></span>
                  </span>
                  <span class="attention-sub">
                    <span class="attention-vendor" x-text="r.vendor"></span>
                    <span class="attention-kind" x-text="kindOf(r)"></span>
                    <span class="attention-detail" x-show="r.detail" x-text="r.detail" :title="r.detail"></span>
                  </span>
                </span>
              </button>
              <button class="attention-dismiss" type="button" x-show="canDismiss(r)" @click="dismiss(r)"
                      title="Dismiss" aria-label="Dismiss"><i class="bi bi-x-lg"></i></button>
            </div>
          </template>
        </div>
      </div>
