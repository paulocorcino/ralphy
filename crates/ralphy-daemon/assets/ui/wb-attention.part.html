      <div class="menu-wrap rail-attention" x-data="wbAttention" :class="{ 'menu-open': open }">
        <button :class="{ active: open }" @click.stop="toggle()" title="Requests that wait for you">
          <svg x-icon="'bell'"></svg>
          <span class="attention-badge" x-show="count() > 0" x-text="count()" x-cloak></span>
        </button>
        <div class="dropdown attention-panel" x-show="open" @click.outside="close()" x-cloak>
          <div class="dropdown-head">Requests that wait for you</div>
          <p class="attention-empty" x-show="count() === 0">Nothing waits for you.</p>
          <template x-for="r in requests" :key="r.id">
            <div class="attention-row">
              <div class="attention-line">
                <span class="attention-vendor" x-text="r.vendor"></span>
                <span class="attention-name" x-text="nameOf(r)"></span>
                <span class="attention-age" x-text="ageOf(r)"></span>
              </div>
              <div class="attention-kind" x-text="kindOf(r)"></div>
              <div class="attention-detail" x-show="r.detail" x-text="r.detail"></div>
              <button class="btn attention-go" x-show="actionOf(r) === 'console'" @click="goTo(r)">Go to the console</button>
              <button class="btn attention-go" x-show="actionOf(r) === 'run'" @click="openRun(r)">Open the run</button>
              <button class="btn attention-dismiss" x-show="canDismiss(r)" @click="dismiss(r)">Dismiss</button>
            </div>
          </template>
          <div class="attention-notify" x-show="canNotify()">
            <span>Notify me in this browser</span>
            <label class="switch">
              <input type="checkbox" :checked="notifyOn" @change="setNotify($event.target.checked).then(() => ($event.target.checked = notifyOn))" />
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
      </div>
