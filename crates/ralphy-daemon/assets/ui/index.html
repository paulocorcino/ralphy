<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="ralphy-build" content="">
    <!-- `interactive-widget=resizes-content` puts the virtual keyboard INSIDE
         the layout viewport on Chrome/Android: the page shrinks and the console
         refits itself with no JS. iOS ignores it and pans the visual viewport
         instead, which is what `keyboardInset` in wb-console.js measures. No
         `maximum-scale`: pinch-zoom stays the operator's. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>Ralphy</title>
    <!-- The SVG is the source and what a modern browser picks; the .ico answers
         the automatic /favicon.ico request that no markup can suppress. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" sizes="any" />
    <!-- Installable, because a tablet has no F11 and no Esc. Added to the home
         screen the shell launches in `display: standalone` — no browser chrome
         at all, permanently, with no fullscreen state for the operator to get
         stuck in. The per-console fullscreen button is the desktop answer; this
         is the iPad one, and they are independent.

         iOS ignores the manifest's icons for the home screen and reads
         `apple-touch-icon`, so the same 192px raster is offered both ways;
         `icon-192.png`/`icon-512.png` are pixel-exact 12×/32× scalings of
         favicon.svg's 16px grid (re-cut them when that art changes).
         `mobile-web-app-capable` is the standard spelling; the `apple-` one is
         still what older iOS reads. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black`, deliberately, not `black-translucent`: the translucent style
         puts the shell's own chrome UNDER the status bar, and the workbench
         layout has no safe-area inset outside the fullscreen console. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ralphy" />
    <meta name="theme-color" content="#14110f" />
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="vendor/devicon/devicon.min.css" />
    <link rel="stylesheet" href="vendor/wunderbaum/wunderbaum.css" />
    <link rel="stylesheet" href="vendor/xterm.css" />
    <!-- part: head.part.html -->
    <!-- The note editor's own stylesheet, BEFORE the card's: `13-notes.css`
         sets the `--crepe-*` tokens that theme it (ADR-0064 §6). -->
    <link rel="stylesheet" href="vendor/crepe/crepe.css" />
    <link rel="stylesheet" href="styles/13-notes.css" />
  </head>
  <body x-data="shell" x-cloak :class="{ 'side-collapsed': !sideOpen, 'runs-open': runsOpen, locked: !$store.connection.authed }">
    <!-- The daemon runs a newer build than this page, and the page holds
         unsaved work (ADR-0070 D6). It stays until the reload. -->
    <div class="build-notice" x-show="$store.connection.buildSkew" x-cloak role="status">
      Ralphy was updated. Save your open work, and this page loads the new version.
    </div>
    <!-- Icons drawn in more than one place, each drawn with `<use>`.
         `os-linux`: Bootstrap Icons has the Windows and Apple logos but no
         Linux penguin, so this is the "Linux" icon of Simple Icons 13.21.0
         (CC0-1.0). `plugged`: Lucide v0.460.0 ships no connected counterpart
         to `unplug`, so this is its two halves pushed together. -->
    <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="os-linux" viewBox="0 0 24 24"><path fill="currentColor" d="M12.504 0c-.155 0-.315.008-.48.021-4.226.333-3.105 4.807-3.17 6.298-.076 1.092-.3 1.953-1.05 3.02-.885 1.051-2.127 2.75-2.716 4.521-.278.832-.41 1.684-.287 2.489a.424.424 0 00-.11.135c-.26.268-.45.6-.663.839-.199.199-.485.267-.797.4-.313.136-.658.269-.864.68-.09.189-.136.394-.132.602 0 .199.027.4.055.536.058.399.116.728.04.97-.249.68-.28 1.145-.106 1.484.174.334.535.47.94.601.81.2 1.91.135 2.774.6.926.466 1.866.67 2.616.47.526-.116.97-.464 1.208-.946.587-.003 1.23-.269 2.26-.334.699-.058 1.574.267 2.577.2.025.134.063.198.114.333l.003.003c.391.778 1.113 1.132 1.884 1.071.771-.06 1.592-.536 2.257-1.306.631-.765 1.683-1.084 2.378-1.503.348-.199.629-.469.649-.853.023-.4-.2-.811-.714-1.376v-.097l-.003-.003c-.17-.2-.25-.535-.338-.926-.085-.401-.182-.786-.492-1.046h-.003c-.059-.054-.123-.067-.188-.135a.357.357 0 00-.19-.064c.431-1.278.264-2.55-.173-3.694-.533-1.41-1.465-2.638-2.175-3.483-.796-1.005-1.576-1.957-1.56-3.368.026-2.152.236-6.133-3.544-6.139zm.529 3.405h.013c.213 0 .396.062.584.198.19.135.33.332.438.533.105.259.158.459.166.724 0-.02.006-.04.006-.06v.105a.086.086 0 01-.004-.021l-.004-.024a1.807 1.807 0 01-.15.706.953.953 0 01-.213.335.71.71 0 00-.088-.042c-.104-.045-.198-.064-.284-.133a1.312 1.312 0 00-.22-.066c.05-.06.146-.133.183-.198.053-.128.082-.264.088-.402v-.02a1.21 1.21 0 00-.061-.4c-.045-.134-.101-.2-.183-.333-.084-.066-.167-.132-.267-.132h-.016c-.093 0-.176.03-.262.132a.8.8 0 00-.205.334 1.18 1.18 0 00-.09.4v.019c.002.089.008.179.02.267-.193-.067-.438-.135-.607-.202a1.635 1.635 0 01-.018-.2v-.02a1.772 1.772 0 01.15-.768c.082-.22.232-.406.43-.533a.985.985 0 01.594-.2zm-2.962.059h.036c.142 0 .27.048.399.135.146.129.264.288.344.465.09.199.14.4.153.667v.004c.007.134.006.2-.002.266v.08c-.03.007-.056.018-.083.024-.152.055-.274.135-.393.2.012-.09.013-.18.003-.267v-.015c-.012-.133-.04-.2-.082-.333a.613.613 0 00-.166-.267.248.248 0 00-.183-.064h-.021c-.071.006-.13.04-.186.132a.552.552 0       <symbol id="plugged" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 7 5-5"/><path d="m2 22 5-5"/><path d="M8.3 18.3a2.4 2.4 0 0 0 3.4 0L14 16l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="M9.5 11.5 12 9"/><path d="M12.5 14.5 15 12"/><path d="m10 8 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z"/></symbol>
    </svg>
    <!-- The top bar is GONE (#top-bar-removal): a full-width strip cost 47px of
         height to carry five things, and every one of them had a better home.
         The daemon's identity — its mark, its name, its uptime — is one subject,
         so it is now one control: the account puck at the head of the rail, with
         the numbers inside the menu it already opened. The product's name and
         the project crumb are not reinstated anywhere: the menu head says which
         daemon this is, and the sidebar names the open project on its top row.
         Nothing on the plane is a caption for something the operator can read
         off the thing itself. -->

    <!-- icon rail: switches the sidebar's view. impl: Projects toggles the
         sidebar; Runs opens the right-hand run panel; Kanban opens the tasks
         board as a canvas overlay (wb-kanban.js). -->
    <nav class="rail">
      <!-- Account puck: the rail's head, above the views, because it is not a
           view — it is who you are talking to. impl: the mark is the daemon's
           avatar (/api/identity); the menu carries the name, the live uptime and
           the security verbs. The menu opens to the SIDE (`.rail .account-menu`),
           over the sidebar: a 48px column has no room to drop one downward. -->
      <!-- part: wb-account.part.html -->
      <!-- The attention list (wb-attention.ts): the requests that wait for the
           operator, as the daemon computed them. The badge is the count, hidden
           at 0; the same count is in the tab title. The panel opens to the SIDE,
           as the account menu does. -->
      <!-- part: wb-attention.part.html -->
      <button :class="{ active: sideOpen && sideView === 'projects' }" @click="showSideView('projects')" title="Projects"><svg x-icon="'folder-tree'"></svg></button>
      <!-- Changes carries NO badge of any kind: a rail roll-up would claim a
           cross-repo aggregate this UI never computes (#317, PRD #314). The
           count's home is the per-project row in the Projects view. -->
      <button :class="{ active: sideOpen && sideView === 'changes' }" @click="showSideView('changes')" title="Changes"><svg x-icon="'git-compare'"></svg></button>
      <button :class="{ active: runsOpen }" @click="toggleRuns()" title="Runs"><svg x-icon="'refresh-cw'"></svg></button>
      <button :class="{ active: kanbanOpen }" @click="toggleKanban()" title="Kanban (tasks)"><svg x-icon="'square-kanban'"></svg></button>
      <!-- Spend opens a CANVAS TAB (ADR-0037 §3, amended by #358: a closable tab
           may be a daemon view, not only an open file), so `$store.tabs.active` tracks the
           canvas rather than a panel of its own. -->
      <button :class="{ active: $store.tabs.active === 'spend' }" @click="$dispatch('workbench:spend-open')" title="Spend (cost of this project)"><svg x-icon="'coins'"></svg></button>
      <!-- spacer pushes the settings gear to the bottom of the rail -->
      <span class="rail-spacer"></span>
      <button :class="{ active: $store.modals.modalOpen('settingsOpen') }" @click="$dispatch('workbench:menus-close'); $dispatch('workbench:settings-open')" title="Settings"><svg x-icon="'settings'"></svg></button>
    </nav>

    <!-- sidebar: project accordion. impl: `$store.projects.projects` comes from the daemon
         (mirror of /api/repos) — slug, branch, state (reachability), remote
         (github|local), and a file `tree`. Opening one lifts it to the top and
         mounts its tree; only one open at a time. -->
    <aside class="side">
      <div class="projects-view" x-show="sideView === 'projects'">
      <div class="side-head">
        <span>Projects</span>
        <span class="spacer"></span>
        <!-- manual refresh: the list does not auto-update (only the live dots do),
             so this re-reads /api/repos to pick up new repos / branch changes. -->
        <button
          class="side-refresh"
          :class="{ spinning: $store.projects.reposLoading }"
          :disabled="$store.projects.reposLoading"
          @click="$store.projects.loadRepos()"
          title="Refresh projects"
          aria-label="Refresh projects"
        >
          <svg x-icon="'refresh-cw'"></svg>
        </button>
        <!-- Add a project (#501) comes before Hosts: it is the more frequent act. -->
        <button class="side-refresh side-add-project" @click="$dispatch('workbench:add-project-open')" title="Add a project" aria-label="Add a project">
          <svg x-icon="'folder-plus'"></svg>
        </button>
        <!-- Lucide v0.460.0 has no `server-plus`: this is its `server` with the
             lower unit shortened so a plus fits beside it. -->
        <button class="side-refresh side-add-host" @click="$dispatch('workbench:hosts-open')" title="Hosts" aria-label="Hosts">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="10" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/><path d="M18 15v6"/><path d="M15 18h6"/></svg>
        </button>
        <!-- count of located projects, at a glance ($store.projects.projects.length) -->
        <span class="count" x-text="$store.projects.projects.length" title="Number of projects"></span>
      </div>
      <!-- daemon-mode repos-load failure (M5, #202): honest error, not seed. -->
      <div class="side-error" x-show="$store.projects.reposError" x-text="$store.projects.reposError" x-cloak></div>
      <!-- The peers' last good read, kept when a read fails (ADR-0070 D3). -->
      <div class="side-error" x-show="$store.projects.fleetError" x-text="$store.projects.fleetError" x-cloak></div>
      <!-- The peers the daemon could not read (ADR-0070 D4). -->
      <div class="side-error" x-show="$store.projects.fleetRejectNote" x-text="$store.projects.fleetRejectNote" x-cloak></div>
      <!-- No project yet: say what to do first (#501). A failed read shows its
           error above instead. -->
      <div class="side-empty projects-empty" x-show="!$store.projects.projects.length && !$store.projects.reposError && !$store.projects.reposLoading" x-cloak>
        <p>No projects yet</p>
        <button class="btn accent" @click="$dispatch('workbench:add-project-open')"><svg x-icon="'folder-plus'"></svg> Add a project</button>
      </div>
      <!-- filters the list client-side on slug/branch; "/" (global shortcut)
           focuses this input; Escape clears it. Hidden while a project is
           open: `has-open` hides every other row, so there is nothing for it
           to filter, and a search box that is visible but does nothing is
           the one an operator types a file name into. -->
      <div class="side-search" x-show="!$store.projects.openSlug">
        <svg x-icon="'search'"></svg>
        <input
          placeholder="Search projects…  /"
          x-model="projectQuery"
          x-ref="projectSearch"
          @keydown.escape="projectQuery = ''"
        />
      </div>

      <ul
        class="projects"
        :class="{ 'has-open': $store.projects.openSlug }"
      >
        <!-- The federated sidebar (#349): one group per environment, local
             first. `.env-block` is `display: contents`, so every `li.project`
             stays a direct flex item of `ul.projects` — the open project's
             `order: -1` rise and the `has-open` sibling hiding both keep
             working across groups. A fleet of one renders no headers at all. -->
        <template x-for="g in $store.projects.fleetGroups(filteredProjects())" :key="g.key">
          <div class="env-block">
            <div class="env-group" x-show="g.header" :title="$store.projects.groupTitle(g)">
              <span class="os-icon" aria-hidden="true">
                <i class="bi bi-windows" x-show="$store.projects.osOf(g) === 'windows'"></i>
                <i class="bi bi-apple" x-show="$store.projects.osOf(g) === 'macos'"></i>
                <svg x-show="$store.projects.osOf(g) === 'linux'"><use href="#os-linux"></use></svg>
                <span x-show="$store.projects.osOf(g) === 'other'"><svg x-icon="'monitor'"></svg></span>
              </span>
              <span class="env-label"><span class="env-host" x-text="$store.projects.groupHost(g) ? $store.projects.groupHost(g) + ' · ' : ''"></span><span class="env-os" x-text="$store.projects.groupLabel(g)"></span></span>
              <span class="env-daemon" x-show="g.showName" x-text="g.name"></span>
              <!-- The state is a glyph, its word in the tooltip and the
                   aria-label (wb-fleet.js `stateIcon`). The glyph becomes the
                   wake button on the two states a nudge can answer. Same glyph,
                   same place: the operator sees the unplugged peer and acts on
                   it without hunting for a control, and the click is the whole
                   consent (ADR-0046). -->
              <!-- `:class` binds plain strings, never an object nested in the
                   array: Alpine stringifies that to the literal class
                   `[object Object]` and the `waking` state never applies. -->
              <button
                class="peer-state wake"
                x-show="$store.projects.peerWakeable(g)"
                :class="[g.state, $store.projects.peerFault(g) ? 'fault' : '', $store.projects.waking[g.daemon] ? 'waking' : '']"
                :disabled="!!$store.projects.waking[g.daemon]"
                :title="wakeTitle(g)"
                :aria-label="$store.projects.waking[g.daemon] ? 'waking' : peerStateWord(g.state)"
                @click.stop="$store.projects.wakePeer(g.daemon)"
              ><svg x-icon="'unplug'"></svg></button>
              <!-- An SSH host on another protocol: the same glyph installs
                   this computer's Ralphy there. The click is the permission. -->
              <button
                class="peer-state wake"
                x-show="$store.projects.peerUpdatable(g)"
                :class="[g.state, 'fault', $store.projects.updating[g.daemon] ? 'waking' : '']"
                :disabled="!!$store.projects.updating[g.daemon]"
                :title="updateTitle(g)"
                :aria-label="$store.projects.updating[g.daemon] ? 'Updating Ralphy' : 'Update Ralphy'"
                @click.stop="$store.projects.updatePeer(g.daemon)"
              ><svg x-icon="'unplug'"></svg></button>
              <span
                class="peer-state"
                x-show="!$store.projects.peerWakeable(g) && !$store.projects.peerUpdatable(g) && $store.projects.peerIcon(g)"
                :class="[g.state, $store.projects.peerFault(g) ? 'fault' : '']"
                role="img"
                :aria-label="peerStateWord(g.state)"
              >
                <span class="glyph" x-show="$store.projects.peerIcon(g) === 'plugged'"><svg aria-hidden="true"><use href="#plugged"></use></svg></span>
                <span class="glyph" x-show="$store.projects.peerIcon(g) === 'unplug'"><svg x-icon="'unplug'"></svg></span>
              </span>
            </div>
            <template x-for="p in g.rows" :key="p.key || p.slug">
              <li class="project" :class="{ open: $store.projects.rowOpen(p), peer: !!p.daemon, unavailable: !$store.projects.peerAvailable(g) }">
            <!-- click toggles the project open/closed (mounts/destroys tree) -->
            <!-- `rowTitle` is what a COLLAPSED row can no longer show: the
                 branch chip moved to the Files bar below, which only the open
                 project renders (#332). It sits on the row, never on
                 `.project-slug`: the name's own title still wins when the
                 pointer is over the name. The slug, the ADR-0008 D7 identity,
                 rides `data-slug` for the browser tests. -->
            <div class="project-head" tabindex="-1" @click="toggle($store.projects.repoRef(p), p)" :title="$store.projects.peerAvailable(g) ? rowTitle(p) : unavailableTitle(g)">
              <span class="chevron"><svg x-icon="'chevron-right'"></svg></span>
              <!-- status dot: the project's daemon-reachability *right now* —
                   green = live (session/daemon active there), grey = idle
                   (registered & reachable but stopped), red = offline
                   (unreachable path). Orthogonal to the provenance icon beside
                   it (GitHub vs local-only). A local-only repo can be live; a
                   GitHub repo can be offline. -->
              <span class="dot" :class="dotClass(p.state)" :title="dotTitle(p.state, p.dotDetail)"></span>
              <!-- provenance: a GitHub-backed repo vs one that lives only on
                   this disk. Orthogonal to the daemon-reachability dot above. -->
              <i
                class="remote"
                :class="p.remote === 'github' ? 'bi bi-github' : 'bi bi-hdd'"
                :title="p.remote === 'github' ? 'On GitHub' : 'Local only'"
              ></i>
              <span class="project-slug" x-text="repoLabel(p)" :title="$store.projects.projectTitle($store.projects.repoRef(p))" :data-slug="p.slug"></span>
              <!-- The branch chip carries the change count. Collapsed, only the
                   count shows — the branch is in `rowTitle` — so a closed row
                   costs the name nothing (#332); open, the chip grows its branch
                   and becomes the switcher. ONE element either way, so the count
                   and the branch cannot disagree about which tree they describe:
                   both read the selected checkout (#407). A collapsed chip is
                   inert — its click falls through to the row's toggle. -->
              <button
                class="branch-chip"
                x-show="$store.projects.rowOpen(p) || projectBadge($store.projects.repoRef(p)).show"
                :class="{ dirty: $store.checkouts.chipDirty(p), disabled: !$store.checkouts.canSwitchBranch(p), collapsed: !$store.projects.rowOpen(p) }"
                :tabindex="$store.projects.rowOpen(p) ? 0 : -1"
                @click="branchChipClick(p, $event)"
                :title="$store.projects.rowOpen(p) ? $store.checkouts.branchChipTitle(p) : projectBadge($store.projects.repoRef(p)).title"
              >
                <span class="branch-chip-ref" x-show="$store.projects.rowOpen(p)">
                  <svg x-icon="$store.checkouts.chipIcon(p)"></svg>
                  <span class="branch-chip-name" x-text="$store.checkouts.chipLabel(p)"></span>
                </span>
                <!-- The change count survives the promotion to a rail view
                     (#317): readable here with no click and no navigation, the
                     exact property PRD #297 built the section for. Renders ONLY
                     for a count that was read and is not zero — never for a
                     failed read. Until a count lands, the dot is the open chip's
                     dirty signal. -->
                <span
                  class="chg-badge"
                  x-show="projectBadge($store.projects.repoRef(p)).show"
                  x-text="projectBadge($store.projects.repoRef(p)).text"
                ></span>
                <span class="branch-chip-dot"
                      x-show="$store.projects.rowOpen(p) && !projectBadge($store.projects.repoRef(p)).show && $store.checkouts.chipDirty(p) && $store.checkouts.canSwitchBranch(p)"></span>
              </button>
              <!-- Unregister, never delete (#363). `@click.stop` because the
                   whole `.project-head` toggles the project open — the removal
                   must not also mount the tree of the row it is dropping. The
                   confirm dialog says the directory on disk survives; the verb
                   is `project.remove`, which spawns `ralphy daemon remove`. -->
              <button
                class="project-remove"
                type="button"
                @click.stop="removeProject(p)"
                title="Remove from Ralphy"
                aria-label="Remove project"
              >
                <svg x-icon="'x'"></svg>
              </button>
            </div>
              </li>
            </template>
          </div>
        </template>
        <!-- The open project's files (wb-files.ts): ONE element after the
             rows, shown for the open project. Its flex `order` puts it right
             under the open row (02-rail-sidebar.css). -->
        <!-- part: wb-files.part.html -->
        <!-- ===================================================================
             The end of the FILES tree of the open project (wbFiles).
        ==================================================================== -->
      </ul>
      </div>

      <!-- Changes: a rail VIEW, not a section under the project row (#317).
           PRD #297 recorded the trigger — "if Changes ever grows its own
           toolbar it outgrows a section" — and PRD #314's write controls fire
           it. Scoped to `$store.projects.openSlug` alone; the per-project count lives on the
           Projects row above, so it stays reachable with no navigation. -->
      <!-- part: wb-changes-panel.part.html -->
      <!-- ===================================================================
           The end of the CHANGES view of the open project (wbChanges).
      ==================================================================== -->
    </aside>

    <!-- canvas -->
    <!-- On a phone the sidebar floats over the canvas (01-base.css), so a tap
         on the canvas is the tap outside it. -->
    <main class="canvas" @pointerdown="phone() && (sideOpen = false)">
      <!-- tab strip: the first tab (Consoles) is fixed and never closes; every
           opened file rides in after it and can be closed. The console controls
           live at the strip's right edge — kept above the workspace so a
           floating console can never cover them. -->
      <div class="tabbar">
        <div class="tabstrip">
          <!-- one tab per entry in `$store.tabs.tabs`: index 0 is the fixed Consoles tab
               (not closable); the rest are opened files. Click activates,
               MIDDLE-click (button 1) or × closes — `auxclick` also fires for the
               right button, which must never cost the operator their tab. -->
          <template x-for="t in $store.tabs.tabs" :key="t.id">
            <div
              class="tab"
              :class="{ active: $store.tabs.active === t.id, pinned: $store.tabs.slot?.kind === 'pin' && $store.tabs.slot.id === t.id, fixed: !t.closable }"
              @click="$store.tabs.activate(t.id)"
              @auxclick.prevent="$event.button === 1 && t.closable && $store.tabs.closeTab(t.id)"
              @contextmenu.prevent="$store.tabs.showTabMenu($event.clientX, $event.clientY, t)"
              :title="t.path || t.title"
            >
              <i class="tab-ic" :class="t.icon"></i>
              <span class="tab-title" x-text="t.title"></span>
              <!-- the slot's pane (ADR-0037 §3c): on screen too, on the right -->
              <i class="tab-pin bi bi-pin-angle-fill" x-show="$store.tabs.slot?.kind === 'pin' && $store.tabs.slot.id === t.id"></i>
              <button class="tab-close" x-show="t.closable" @click.stop="$store.tabs.closeTab(t.id)" title="Close">
                <i class="bi bi-x"></i>
              </button>
            </div>
          </template>
          <!-- A console of the stage in its own tab (ADR-0037 §3d). The rows are
               the rows of the column list; the classes are their own, so
               queries scoped to the column list stay inert. -->
          <div x-data="wbConsoleTabMenu" class="tab-add-wrap" @click.outside="open = false">
            <button type="button" class="tab-add" title="Open a console in a tab" aria-label="Open a console in a tab"
                    @click="toggle($el.getBoundingClientRect())">
              <i class="bi bi-plus-lg"></i>
            </button>
            <div class="dropdown console-tab-menu" x-show="open" x-cloak
                 :style="`top: ${menuAt.top}px; left: ${menuAt.left}px`">
              <template x-for="g in groups" :key="g.fence ? g.fence.id : '-loose'">
                <div class="column-group">
                  <div class="dropdown-head column-group-head" x-show="g.fence">
                    <span class="column-group-name" x-text="g.fence?.name"></span>
                  </div>
                  <template x-for="r in g.rows" :key="r.id">
                    <button class="console-tab-item" :disabled="rowOff(r)" :title="r.enabled ? '' : r.reason || ''"
                            :data-id="r.id" @click="pick(r)">
                      <i class="bi bi-terminal"></i>
                      <span class="row-name" x-text="rowLabel(r)"></span>
                      <span class="session-state" :class="r.state" x-show="r.state" :title="window.WBConsole?.agentStateTitle(r.state, r.detail)"></span>
                      <span class="row-off" x-show="!r.running">not running</span>
                    </button>
                  </template>
                </div>
              </template>
              <div class="column-empty" x-show="!groups.length">No console on the stage</div>
            </div>
          </div>
        </div>

        <!-- console controls, only meaningful on the Consoles tab -->
        <!-- part: wb-consoles-tab-menus.part.html -->
        <!-- ===================================================================
             The end of the console menus (wbConsoleMenus, wb-consoles-tab.ts).
             =================================================================== -->
      </div>

      <div class="tabbody">
        <!-- Consoles tab: the floating-console workspace. Consoles live here as
             draggable windows over the dotted floor. -->
        <!-- The pane of the console tabs (ADR-0037 §3d): the window of a
             console that has a tab moves here from the stage, and only the
             active tab's window is shown. -->
        <section id="console-tabs-pane" class="console-tabs-pane"
                 :class="{ 'tab-hidden': !$store.tabs.consoleTabShown() }"></section>
        <section class="consoles-tab" :class="{ 'tab-hidden': !$store.tabs.stageShown() }">
          <!-- `#workspace` is the VIEWPORT (overflow:auto) and `#stage` the plane
               it scrolls over; wb-console.js appends the floating console windows
               into the stage and sizes it from their bbox (issue #336). -->
          <div id="workspace"><div id="stage"></div></div>
          <!-- The saved desk cannot be read (ADR-0070 D4): say so, and offer
               the one action. The daemon keeps the old file under a new name. -->
          <div class="desk-failure" x-show="deskFailure" x-cloak role="alert">
            <span x-text="'Could not read the saved desk: ' + deskFailure"></span>
            <button class="btn" @click="startNewDesk()"
                    title="The old desk file is kept with a new name.">Start a new desk</button>
          </div>
          <!-- The footer pills and the columns list are the state of
               wbColumns (wb-consoles-tab.ts). The wrapper is not positioned,
               so both still resolve against `.consoles-tab`. -->
          <!-- part: wb-consoles-tab-columns.part.html -->
        </section>

        <!-- ===================================================================
             Spend tab (#358, PRD #355) — what the OPEN project cost.

             Every number on screen arrives already RENDERED by `/api/spend`:
             the total, the token meter, each volume and each percentage. The
             only arithmetic on this page is a bar's CSS width. `spendView()`
             (wb-spend.js) decides which of the four states is on screen and
             carries the explanatory copy — words and decisions, never figures.

             Composition: one hero band carrying the number the tab exists for,
             then a two-column body — the token split on the left, the unpriced
             volume on the right. The grid is what the following slices extend:
             #359's tiles join the hero band and its grids drop under the body,
             into a rhythm that is already established rather than invented per
             pane.

             Palette: the ADR-0035 warm-dark tokens, no new hex. The two
             existing accents are used for the only two claims that earn one —
             gold for a figure that is a floor and for the half of the gap that
             is still actionable, terracotta for what is lost. Everything else
             is the grey ramp, and length does the rest of the work.
             ================================================================ -->
        <!-- part: wb-spend-panel.part.html -->

        <!-- file-viewer panes are appended here by wb-file-viewer.ts, one per file
             tab (code = Monaco, markdown = rendered+mermaid). impl: a seed
             synthesises file bytes — fetch the real file; a Save emits a `save`
             intent (workbench:action) carrying the new content to persist. -->
        <div id="viewers"></div>
      </div>

      <!-- ===================================================================
           Kanban board — an overlay over the canvas, toggled by the Kanban rail
           button. The open project's issues placed in four columns
           by ralphy's own judgment (wb-kanban.js): Backlog · Ready for agent ·
           Ready for human · Closed. The two Ready columns are ordered by the
           dependency graph (Kahn, blocked.rs); Backlog is a flat filtered list.
           Read-only except labels; clicking a card opens the detail drawer.
      ==================================================================== -->
      <!-- part: wb-board.part.html -->

    </main>

    <!-- ===================================================================
         The Runs panel and the run modal: the component `wbRuns`.
    ==================================================================== -->
    <!-- part: wb-runs-panel.part.html -->

    <!-- right-click menu, built per-node by app.js (open/rename/copy-path/
         new/delete). Each item emits a workbench:action intent — no direct FS. -->
    <div id="ctxmenu" class="ctxmenu"></div>

    <!-- ===================================================================
         Settings modal — data-driven from WB_SETTINGS (wb-settings.ts). Left
         rail = sections; right = the knobs for the active section, each with a
         plain-English blurb. Changing a value emits `setting-change`; the
         daemon persists it via `config.set`/`config.unset`.
    ==================================================================== -->
    <!-- part: wb-settings-dialog.part.html -->

    <!-- ===================================================================
         Security modal — mirrors ralphy's daemon auth model (ADR-0032):
         access token, optional password (PBKDF2), and TOTP 2FA whose secret is
         shown exactly once. "Revoke" is the real "delete the daemon-totp file".
    ==================================================================== -->
    <!-- part: wb-security-dialog.part.html -->

    <!-- ===================================================================
         About — the daemon's product card: the git-published version (tracks
         the release tag), the one-line description, and the license / source /
         creator facts. All read from `/api/about`; a single fetch, no writes.
    ==================================================================== -->
    <!-- What's new (ADR-0056 §7): the WHOLE gap between the running build and
         the newest, newest first — not just the last release. At a candidate
         every few days the typical reader is several behind, and a panel that
         showed only the last one would hide the reason to take it. -->
    <!-- part: wb-release-dialogs.part.html -->

    <!-- ===================================================================
         Branch switcher — click the branch chip on a project to open. A
         filtered list (current pinned + ticked) with a create-from-current
         affordance when the typed name is new. Switching/creating emits an
         intent (`branch-switch` / `branch-create`); the daemon runs the real
         `git checkout`. The UI reflects the new branch optimistically.
         Below the list, a Worktrees section (`worktree.list`, ADR-0063 §4)
         renders once the daemon answered the listing: one row per workbench
         worktree — clicking it SELECTS that checkout for the project (#406):
         the Files tree, the viewer, Find and the branch chip follow it, and
         the choice is remembered in the desk; `primary` selects the primary
         tree back — then a create row whose own field + Enter runs
         `worktree.add` (ADR-0063 §2) from the current branch. Each worktree
         row's tail holds a remove action (`worktree.remove`, #409) that
         surfaces each gate's message verbatim (ADR-0063 §4); `.stop` keeps
         the row's own selecting click out of it.
    ==================================================================== -->
    <!-- part: wb-branch-dialog.part.html -->

    <!-- ===================================================================
         Confirm dialog — the design-system replacement for the native
         window.confirm on destructive actions (delete). Driven by
         `confirmModal` + `askConfirm()` (the store `modals`): the scrim dims the canvas so
         the choice has focus, Enter confirms unless a button has focus (that
         button's own click answers), Escape/scrim/✕ cancels. The Enter that
         confirms is default-prevented: closing hands focus back to the opener,
         and its keypress would otherwise click that button again.
    ==================================================================== -->
    <div class="modal-scrim" x-cloak x-bind="$store.modals.scrim('$store.modals.confirmModal.open', () => $store.modals.confirmRespond(false))">
      <div
        class="modal confirm-modal"
        role="alertdialog"
        aria-modal="true"
        :aria-label="$store.modals.confirmModal.title"
        @keydown.enter.window="$store.modals.confirmModal.open && !$event.target.closest?.('button') && ($event.preventDefault(), $store.modals.confirmRespond(true))"
      >
        <div class="modal-head">
          <i class="bi bi-exclamation-triangle" x-show="$store.modals.confirmModal.danger" style="color: var(--danger)"></i>
          <i class="bi bi-question-circle" x-show="!$store.modals.confirmModal.danger"></i>
          <span class="modal-title" x-text="$store.modals.confirmModal.title"></span>
          <span class="spacer"></span>
          <button class="modal-x" @click="$store.modals.confirmRespond(false)" title="Close"><i class="bi bi-x-lg"></i></button>
        </div>
        <p class="confirm-body" x-text="$store.modals.confirmModal.message"></p>
        <div class="modal-foot">
          <button class="btn" @click="$store.modals.confirmRespond(false)" x-text="$store.modals.confirmModal.cancelLabel"></button>
          <button
            class="btn"
            :class="$store.modals.confirmModal.danger ? 'danger' : 'accent'"
            @click="$store.modals.confirmRespond(true)"
            x-text="$store.modals.confirmModal.confirmLabel"
          ></button>
        </div>
      </div>
    </div>

    <!-- ===================================================================
         Prompt dialog — the design-system replacement for the native
         window.prompt when the workbench needs one word from the operator
         (naming a new file or folder). Driven by `promptModal` + `askPrompt()`
         (the store `modals`). Enter submits through `promptSubmit()`, which validates and
         keeps the dialog OPEN on a bad name so it can be fixed in place;
         Escape/scrim/✕ cancel and resolve null.
    ==================================================================== -->
    <div class="modal-scrim" x-cloak x-bind="$store.modals.scrim('$store.modals.promptModal.open', () => $store.modals.promptRespond(null))">
      <div
        class="modal prompt-modal"
        role="dialog"
        aria-modal="true"
        :aria-label="$store.modals.promptModal.title"
      >
        <div class="modal-head">
          <i class="bi bi-input-cursor-text"></i>
          <span class="modal-title" x-text="$store.modals.promptModal.title"></span>
          <span class="spacer"></span>
          <button class="modal-x" @click="$store.modals.promptRespond(null)" title="Close"><i class="bi bi-x-lg"></i></button>
        </div>
        <p class="prompt-where" x-text="$store.modals.promptModal.message" x-show="$store.modals.promptModal.message"></p>
        <input
          id="prompt-input"
          class="prompt-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          :value="$store.modals.promptModal.value"
          :placeholder="$store.modals.promptModal.placeholder"
          @input="$store.modals.promptTyped($event.target.value)"
          @keydown.enter.prevent="$store.modals.promptSubmit()"
        />
        <p class="prompt-error" x-show="$store.modals.promptModal.error" x-text="$store.modals.promptModal.error"></p>
        <div class="modal-foot">
          <button class="btn" @click="$store.modals.promptRespond(null)">Cancel</button>
          <button class="btn accent" @click="$store.modals.promptSubmit()" x-text="$store.modals.promptModal.confirmLabel"></button>
        </div>
      </div>
    </div>

    <!-- ===================================================================
         Move destination picker (issue #364) — browses real directories one
         level at a time through `tree.list`, so the destination of a move is
         PICKED, never typed. wb-move-dialog.ts is the component that owns it:
         the files open it with `workbench:move-open`, and it answers with
         `workbench:move-confirmed`. The moved folder and its own subtree are
         absent from the rows by construction.
    ==================================================================== -->
    <!-- part: wb-move-dialog.part.html -->

    <!-- ===================================================================
         The upload dialog (wbUploadDialog, wb-files-upload.ts): the files
         dropped or picked for one folder, the ones over the limit, and one
         choice for the names that exist.
    ==================================================================== -->
    <div class="upload-dialog" x-data="wbUploadDialog" @workbench:upload-open.window="openUpload($event.detail)">
    <div class="modal-scrim" x-cloak x-bind="$store.modals.scrim('upload.open', () => uploadCancel())">
      <div class="modal upload-picker" role="dialog" aria-modal="true" aria-label="Upload files">
        <div class="modal-head">
          <i class="bi bi-cloud-upload"></i>
          <span class="modal-title">Upload files</span>
          <span class="modal-sub" x-text="upload.folder || $store.projects.projectLabel(upload.repo) + ' (project root)'"></span>
          <span class="spacer"></span>
          <button class="modal-x" @click="uploadCancel()" title="Close"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="move-list">
          <template x-for="r in upload.rows" :key="r.name">
            <div class="upload-file" :class="{ refused: r.tooBig }">
              <i class="bi bi-file-earmark"></i>
              <span class="upload-name" x-text="r.name"></span>
              <span class="upload-state" x-text="uploadRowText(r)"></span>
            </div>
          </template>
        </div>
        <fieldset class="upload-choice" x-show="uploadHasExisting()">
          <legend>Some of these names exist in the folder</legend>
          <label><input type="radio" value="keep_both" x-model="upload.choice"> Keep both</label>
          <label><input type="radio" value="replace" x-model="upload.choice"> Replace</label>
          <label><input type="radio" value="skip" x-model="upload.choice"> Skip</label>
        </fieldset>
        <p class="move-error" x-show="upload.error" x-text="upload.error"></p>
        <div class="modal-foot">
          <button class="btn" @click="uploadCancel()">Cancel</button>
          <button class="btn accent" @click="uploadConfirm()" :disabled="uploadBlocked()">Upload</button>
        </div>
      </div>
    </div>
    </div>

    <!-- ===================================================================
         Properties of a file or a folder: the facts of one path (`file.stat`)
         and, for a folder, what is inside it (`tree.size`), which can take
         seconds. wb-properties-dialog.ts is the component that owns it: the
         files open it with `workbench:properties-open`. Names and values are
         shown with x-text only.
    ==================================================================== -->
    <div class="properties-dialog" x-data="wbPropertiesDialog" @workbench:properties-open.window="openProperties($event.detail)">
    <div class="modal-scrim" x-cloak x-bind="$store.modals.scrim('props.open', () => propsClose())">
      <div class="modal properties-modal" role="dialog" aria-modal="true" aria-label="Properties" :aria-busy="propsBusy()">
        <div class="modal-head">
          <i class="bi bi-info-circle"></i>
          <span class="modal-title">Properties</span>
          <span class="spacer"></span>
          <button class="modal-x" @click="propsClose()" title="Close"><i class="bi bi-x-lg"></i></button>
        </div>
        <dl class="props-list">
          <template x-for="r in propsRows()" :key="r.label">
            <div class="props-row">
              <dt x-text="r.label"></dt>
              <dd>
                <span class="files-spinner" x-show="r.pending"></span>
                <span x-text="r.value"></span>
                <button class="props-retry" x-show="r.retry" @click="propsRetrySize()">Try again</button>
              </dd>
            </div>
          </template>
        </dl>
        <p class="props-status" role="status" x-text="propsStatus()"></p>
        <div class="modal-foot">
          <button class="btn" @click="propsCopy()" x-text="props.copied ? 'Copied' : 'Copy'"></button>
          <button class="btn accent" @click="propsClose()">Close</button>
        </div>
      </div>
    </div>
    </div>

    <!-- ===================================================================
         Add a project (#501): a folder on this computer or on a peer becomes
         a project. The daemon that owns the folder lists it (`dir.list`) and
         runs `ralphy daemon add` (`project.add`); wb-add-project.ts holds the
         state. Folder names are shown with x-text only.
    ==================================================================== -->
    <!-- part: wb-add-project-dialog.part.html -->

    <!-- ===================================================================
         Add a host (#497): a computer reached over SSH becomes a peer. The
         daemon runs `ralphy host …` on this computer; wb-hosts.ts holds the
         state, and wb-hosts-dialog.ts is the component that owns it. Everything
         the host says is shown with x-text only.
    ==================================================================== -->
    <!-- part: wb-hosts-dialog.part.html -->

    <!-- ===================================================================
         Login gate — a fully-opaque overlay shown when `!authed`. Because it's
         solid (not just dimmed) and the chrome is blanked (body.locked), there's
         nothing behind to read: the real daemon never renders the app until
         /api/login succeeds, so there's nothing to peek at.
    ==================================================================== -->
    <!-- part: wb-login.part.html -->

    <script src="vendor/marked.min.js"></script>
    <script src="vendor/dompurify.min.js"></script>
    <script src="vendor/mermaid.min.js"></script>
    <script src="vendor/lucide.min.js"></script>
    <script src="vendor/wunderbaum/wunderbaum.umd.min.js"></script>
    <script src="vendor/qrcode.js"></script>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/xterm-addon-fit.js"></script>
    <script src="vendor/xterm-addon-webgl.js"></script>
    <script src="vendor/xterm-addon-web-links.js"></script>
    <script src="vendor/xterm-addon-unicode11.js"></script>
    <!-- Monaco's AMD loader installs a global `define`; it MUST come after every
         UMD vendor above, or they register as anonymous AMD modules and never
         set window.marked / mermaid / Wunderbaum / Terminal. -->
    <script src="vendor/monaco/vs/loader.js"></script>
    <script src="vendor/crepe/crepe.js"></script>
    <!-- The page's one module (ADR-0075 D5). It runs after the classic scripts
         above, imports the rest of the page, and starts Alpine. -->
    <script type="module" src="main.js"></script>
  </body>
</html>
