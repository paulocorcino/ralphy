<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ralphy · detached file</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" sizes="any" />
    <!-- same vendored styles as the shell, so the viewer looks identical -->
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="vendor/devicon/devicon.min.css" />
    <link rel="stylesheet" href="styles/01-base.css" />
    <link rel="stylesheet" href="styles/02-rail-sidebar.css" />
    <link rel="stylesheet" href="styles/03-runs.css" />
    <link rel="stylesheet" href="styles/04-canvas.css" />
    <link rel="stylesheet" href="styles/05-workspace.css" />
    <link rel="stylesheet" href="styles/06-consoles.css" />
    <link rel="stylesheet" href="styles/07-viewers.css" />
    <link rel="stylesheet" href="styles/08-modals.css" />
    <link rel="stylesheet" href="styles/09-branch.css" />
    <link rel="stylesheet" href="styles/10-kanban.css" />
    <link rel="stylesheet" href="styles/11-appended.css" />
    <link rel="stylesheet" href="styles/12-spend.css" />
    <link rel="stylesheet" href="styles/13-notes.css" />
    <style>
      /* this window IS the viewer — fill it */
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
      }
      #viewers {
        position: fixed;
        inset: 0;
      }
      .detached-empty {
        color: var(--danger);
        font-family: ui-monospace, monospace;
        padding: 1.2rem;
      }
    </style>
  </head>
  <body>
    <!-- wb-file-viewer.ts mounts the single file pane here (reused verbatim from the
         shell); this popup runs its own Monaco / marked / mermaid. -->
    <div id="viewers"></div>

    <script type="module" src="detached-main.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/dompurify.min.js"></script>
    <script src="vendor/mermaid.min.js"></script>
    <!-- Monaco's AMD loader installs a global `define`; it MUST come after the
         UMD vendors above (see index.html). -->
    <script src="vendor/monaco/vs/loader.js"></script>
  </body>
</html>
