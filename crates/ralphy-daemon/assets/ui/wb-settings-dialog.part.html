    <div class="settings-dialog" x-data="wbSettingsDialog" @workbench:settings-open.window="openSettings()"
         @workbench:log-off.window="settingsOpen = false"
         @workbench:panels-reread.window="settingsOpen && readSettings()">
    <div class="modal-scrim" x-cloak x-bind="$store.modals.scrim('settingsOpen', () => closeSettings())">
      <div class="modal settings-modal" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="modal-head">
          <svg x-icon="'settings'"></svg>
          <span class="modal-title">Settings</span>
          <span class="modal-sub">Each section says where it is saved</span>
          <span class="spacer"></span>
          <button class="modal-x" @click="closeSettings()" title="Close"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="settings-body">
          <nav class="settings-nav">
            <!-- client group: this browser profile's own, held in the view
                 store (wb-client-view.js) and never sent to the daemon -->
            <div class="settings-navgroup"><i class="bi bi-window-stack"></i> Workbench · this browser</div>
            <template x-for="sec in SETTINGS.filter((s) => s.scope === 'client')" :key="sec.id">
              <button
                class="settings-navitem"
                :class="{ active: settingsSection === sec.id }"
                @click="settingsSection = sec.id"
              >
                <i class="bi" :class="sec.icon"></i><span x-text="sec.title"></span>
              </button>
            </template>
            <!-- daemon group: machine-wide, one for every project -->
            <div class="settings-navgroup"><i class="bi bi-hdd-network"></i> Daemon · this machine</div>
            <template x-for="sec in SETTINGS.filter((s) => s.scope === 'daemon')" :key="sec.id">
              <button
                class="settings-navitem"
                :class="{ active: settingsSection === sec.id }"
                @click="showSettingsSection(sec.id)"
              >
                <i class="bi" :class="sec.icon"></i><span x-text="sec.title"></span>
              </button>
            </template>
            <!-- project group: these settings belong to the open repo, persisted
                 in <repo>/.ralphy/settings.json -->
            <div class="settings-navgroup project">
              <i class="bi" :class="$store.projects.openSlug ? 'bi-folder2-open' : 'bi-folder2'"></i>
              <span x-text="$store.projects.openSlug ? ('Project · ' + $store.projects.projectLabel($store.projects.openSlug)) : 'Project · none open'"></span>
            </div>
            <template x-for="sec in SETTINGS.filter((s) => s.scope === 'project')" :key="sec.id">
              <button
                class="settings-navitem"
                :class="{ active: settingsSection === sec.id }"
                @click="settingsSection = sec.id"
                :disabled="!$store.projects.openSlug"
                :title="!$store.projects.openSlug ? 'Open a project to edit its settings' : ''"
              >
                <i class="bi" :class="sec.icon"></i><span x-text="sec.title"></span>
              </button>
            </template>
          </nav>
          <div class="settings-content">
            <p class="side-error" x-show="settingsError" x-text="settingsError"></p>
            <template x-for="sec in SETTINGS" :key="sec.id">
              <section x-show="settingsSection === sec.id">
                <div class="settings-h2row">
                  <h2 class="settings-h2" x-text="sec.title"></h2>
                  <span class="scope-chip" :class="sec.scope"
                        x-text="sec.scope === 'client' ? 'This browser only'
                                : sec.scope === 'daemon' ? 'Daemon · all projects'
                                : ($store.projects.openSlug ? ('Project · ' + $store.projects.projectLabel($store.projects.openSlug)) : 'Project · none open')"></span>
                </div>
                <p class="settings-blurb" x-text="sec.blurb"></p>
                <!-- per-project sections need an open repo to write into -->
                <p class="settings-noproject" x-show="sec.scope === 'project' && !$store.projects.openSlug">
                  <i class="bi bi-info-circle"></i> Open a project to edit its settings. They are saved in
                  <code>&lt;repo&gt;/.ralphy/settings.json</code>.
                </p>
                <template x-for="it in sec.items" :key="it.key">
                  <div class="set-row" x-show="sec.scope !== 'project' || $store.projects.openSlug">
                    <div class="set-main">
                      <label class="set-label" x-text="it.label"></label>
                      <!-- control, chosen by type -->
                      <template x-if="it.type === 'select'">
                        <select class="set-input" @change="saveSetting(it.key, $event.target.value)">
                          <template x-for="o in it.options" :key="o">
                            <option :value="o" :selected="settings[it.key] === o" x-text="o"></option>
                          </template>
                        </select>
                      </template>
                      <template x-if="it.type === 'tristate'">
                        <select class="set-input" @change="saveSetting(it.key, $event.target.value)">
                          <template x-for="o in TRISTATE" :key="o">
                            <option :value="o" :selected="settings[it.key] === o" x-text="o === 'unset' ? 'Default (not set)' : o"></option>
                          </template>
                        </select>
                      </template>
                      <!-- `readonly` is not decoration: the daemon REFUSES to
                           write these keys, so an editable field here would
                           take the edit and come back "config change refused".
                           Disabled, the value is still readable. -->
                      <template x-if="it.type === 'text'">
                        <input class="set-input" type="text" :placeholder="it.placeholder || ''"
                               :disabled="it.readonly === true" :title="it.readonly === true ? 'Read-only. See the note below.' : ''"
                               :value="settings[it.key]" @change="saveSetting(it.key, $event.target.value)" />
                      </template>
                      <!-- `settingsOpen` is half of this condition on purpose: a
                           `type="password"` sitting in a closed modal is still
                           a password field to the browser's manager, and it is
                           paired with whatever text field the operator types
                           into next (see the login gate's note). -->
                      <template x-if="settingsOpen && it.type === 'password'">
                        <input class="set-input" type="password" :placeholder="it.placeholder || '••••••••'"
                               :disabled="it.readonly === true" :title="it.readonly === true ? 'Read-only. See the note below.' : ''"
                               :value="settings[it.key]" @change="saveSetting(it.key, $event.target.value)" />
                      </template>
                      <!-- a plain checkbox: the value is a real boolean, so it
                           never goes through the string coercion the config
                           inputs above need -->
                      <template x-if="it.type === 'toggle'">
                        <input class="set-check" type="checkbox"
                               :disabled="it.readonly === true" :title="it.readonly === true ? 'Read-only. See the note below.' : ''"
                               :checked="settings[it.key] === true"
                               @change="saveSetting(it.key, $event.target.checked)" />
                      </template>
                      <template x-if="it.type === 'number'">
                        <input class="set-input set-num" type="number" :min="it.min" :max="it.max"
                               :value="settings[it.key]" @change="saveSetting(it.key, $event.target.value)" />
                      </template>
                    </div>
                    <p class="set-help" x-text="it.help"></p>
                  </div>
                </template>
                <!-- desk history: its own body, rows from wb-desk-history.js -->
                <template x-if="sec.id === 'desk-history'">
                  <div class="desk-history">
                    <div class="sec-actions">
                      <button class="btn" @click="loadDeskHistory()" title="Read the list again from the daemon">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                      </button>
                      <button class="btn" @click="pickDeskUpload()" title="Restore a layout from a file on this device">
                        <i class="bi bi-upload"></i> Upload…
                      </button>
                      <input id="desk-upload-input" type="file" accept=".json,application/json" hidden
                             @change="uploadDeskVersion($event)" />
                    </div>
                    <p class="sec-note desk-history-error" x-show="deskHistory.error" x-text="deskHistory.error"></p>
                    <p class="sec-note" x-show="deskHistory.loaded && !deskHistory.rows.length">
                      No saved layouts yet. A layout is saved after you move, open or close a console.
                    </p>
                    <template x-for="row in deskHistory.rows" :key="row.id">
                      <div class="set-row desk-history-row">
                        <div class="set-main">
                          <span class="set-label" x-text="row.when"></span>
                          <span class="desk-history-actions">
                            <button class="btn" @click="restoreDeskVersion(row)">Restore…</button>
                            <button class="btn" @click="downloadDeskVersion(row)" title="Save this layout as a file on this device">
                              <i class="bi bi-download"></i> Download
                            </button>
                          </span>
                        </div>
                        <p class="set-help" x-text="row.reason + ' · ' + row.counts"></p>
                      </div>
                    </template>
                  </div>
                </template>
                <!-- devices: its own body, the wbDevices component (wb-devices.ts).
                     Built only while the section is open, so it reads the log
                     each time it opens and never on a page load. -->
                <template x-if="sec.id === 'devices' && settingsOpen && settingsSection === 'devices'">
                  <div class="devices" x-data="wbDevices">
                    <div class="sec-actions">
                      <button class="btn" @click="load()" title="Read the list again from the daemon">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                      </button>
                    </div>
                    <p class="sec-note devices-error" x-show="error" x-text="error"></p>
                    <p class="sec-note" x-show="loaded && !devices.length">No device has connected yet.</p>
                    <template x-for="d in devices" :key="d.device">
                      <div class="set-row device-row">
                        <div class="set-main">
                          <span class="set-label" x-text="d.name"></span>
                          <span class="device-this" x-show="d.this">This device</span>
                          <button class="btn" @click="toggle(d)" x-text="open === d.device ? 'Hide activity' : 'Show activity'"></button>
                        </div>
                        <p class="set-help" x-text="d.detail"></p>
                        <template x-if="open === d.device">
                          <div class="device-events">
                            <p class="sec-note devices-error" x-show="eventsError" x-text="eventsError"></p>
                            <template x-for="(e, i) in events" :key="i">
                              <div class="device-event">
                                <span class="device-event-when" x-text="e.when"></span>
                                <span x-text="e.text"></span>
                                <span class="device-event-ip" x-text="e.ip"></span>
                              </div>
                            </template>
                            <details class="device-raw" x-show="events.length">
                              <summary>Raw data</summary>
                              <pre x-text="raw"></pre>
                            </details>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </section>
            </template>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" @click="closeSettings()">Done</button>
        </div>
      </div>
    </div>
    </div>
