      <div class="board-panel" x-data="wbBoard">
      <section class="kanban" x-show="kanbanOpen" x-cloak aria-label="Kanban board">
        <div class="kanban-head">
          <span class="kanban-title"><svg x-icon="'square-kanban'"></svg> Board</span>
          <span class="kanban-scope" x-text="$store.projects.openSlug ? $store.projects.projectLabel($store.projects.openSlug) : 'No project open'" :title="$store.projects.projectTitle($store.projects.openSlug)"></span>
          <span class="spacer"></span>
          <!-- board-wide search + label filter (apply to every column) -->
          <div class="kanban-search">
            <svg x-icon="'search'"></svg>
            <input x-model="kanbanFilter" placeholder="Search issues…  #, title, body" />
          </div>
          <select class="kanban-select" x-model="kanbanLabel" title="Filter by label">
            <option value="__all">All labels</option>
            <option value="__none">No label</option>
            <template x-for="l in kanbanLabelOptions()" :key="l">
              <option :value="l" x-text="l"></option>
            </template>
          </select>
          <!-- The repo's ready plan, where the CARD cannot carry it: a plan whose
               issue is filtered out of the board, or absent from the fold, would
               otherwise be invisible — and a plan nobody can see is one nobody can
               discard, which is the state this affordance exists to end. -->
          <button class="kanban-plan-chip" x-show="planChipLabel()"
                  :class="{ warn: planPillWarns(openPlan()?.summary?.issue) }"
                  @click="openPlanModal()"
                  title="Open the plan for the next run">
            <svg x-icon="'scroll-text'"></svg><span x-text="planChipLabel()"></span>
          </button>
          <!-- the explicit refresh trigger (#301): the board is signal-driven,
               never polled, so the operator keeps a manual door -->
          <button class="kanban-refresh" @click="refreshBoard()" :disabled="boardRefreshing"
                  :class="{ spinning: boardRefreshing }" title="Refresh the board">
            <svg x-icon="'rotate-cw'"></svg>
          </button>
          <button class="kanban-close" @click="toggleKanban()" title="Close"><i class="bi bi-x-lg"></i></button>
        </div>

        <div class="kanban-empty" x-show="!$store.projects.openSlug">Open a project to see its board.</div>
        <!-- A whole-tracker fold is several `gh` calls; until it lands there are
             no rows, and the empty state below would otherwise assert "no issues"
             about a board nobody has read yet. The spinner outranks it. -->
        <div class="kanban-loading" x-show="$store.projects.openSlug && boardRefreshing && projectIssues().length === 0">
          <span class="kanban-spinner" aria-hidden="true"></span>
          Loading the board for <b x-text="$store.projects.projectLabel($store.projects.openSlug)"></b>…
        </div>
        <div class="kanban-empty"
             x-show="$store.projects.openSlug && !boardRefreshing && !$store.board.boardError[$store.projects.openSlug] && projectIssues().length === 0">
          No issues in <b x-text="$store.projects.projectLabel($store.projects.openSlug)"></b>.
        </div>
        <div class="kanban-error" x-show="$store.projects.openSlug && $store.board.boardError[$store.projects.openSlug]">
          <svg x-icon="'alert-triangle'"></svg> <span x-text="$store.board.boardError[$store.projects.openSlug]"></span>
        </div>

        <div class="kanban-cols" x-show="$store.projects.openSlug && projectIssues().length">
          <template x-for="col in KANBAN.COLUMNS" :key="col.id">
            <section class="kanban-col" :class="'col-' + col.id">
              <div class="kanban-col-head">
                <svg x-icon="col.lucide"></svg>
                <span class="kanban-col-title" x-text="col.title"></span>
                <span class="kanban-col-count" x-text="kanbanCount(col.id)"></span>
                <span class="spacer"></span>
                <!-- Backlog gets a sort control; the Ready columns are graph-ordered -->
                <select class="kanban-sort" x-show="col.id === 'backlog'" x-model="kanbanSort" title="Sort the backlog">
                  <template x-for="s in KANBAN.SORTS" :key="s.id">
                    <option :value="s.id" x-text="s.label"></option>
                  </template>
                </select>
                <span class="kanban-col-note" x-show="col.id === 'agent' || col.id === 'human'"
                      title="Ordered by the “## Blocked by” links">Graph order</span>
              </div>
              <div class="kanban-col-body">
                <template x-for="iss in kanbanColumns()[col.id]" :key="iss.number">
                  <article class="kanban-card"
                           :class="{ sel: kanbanSel === iss.number, running: !!issueRunning(iss.number), closed: iss.state === 'closed' }"
                           @click="openIssue(iss.number)">
                    <div class="kc-top">
                      <span class="kc-num" x-text="'#' + iss.number"></span>
                      <span class="kc-blocked" x-show="issueBlockers(iss).some((b) => b.open)" title="Has an open blocker">
                        <i class="bi bi-lock-fill"></i>
                      </span>
                      <span class="spacer"></span>
                      <span class="kc-close" x-show="iss.state === 'closed'" :class="iss.reason" x-text="closeLabel(iss)"></span>
                      <span class="kc-assignee" x-show="iss.assignees && iss.assignees.length"
                            :title="(iss.assignees || []).join(', ')"><i class="bi bi-person-fill"></i></span>
                    </div>
                    <div class="kc-title" x-text="iss.title"></div>
                    <!-- run pill: the actively-worked issue of a live run -->
                    <!-- `.stop` is load-bearing: the parent <article> opens the
                         detail drawer, and the pill goes to the RUN instead -->
                    <div class="kc-run" x-show="issueRunning(iss.number)"
                         @click.stop="$dispatch('workbench:run-open', { issue: iss.number })" title="Open this run">
                      <span class="kc-run-face" x-text="issueRunning(iss.number)?.face"></span>
                      <span class="kc-run-glyph" x-text="issueRunning(iss.number)?.glyph"></span>
                      <span class="kc-run-txt" x-text="runStateWord(issueRunning(iss.number)?.state) + ' · ' + (issueRunning(iss.number)?.agent || '')"></span>
                    </div>
                    <!-- plan pill: a FINALIZED plan for this issue is sitting in
                         `.ralphy/plan.md`, and the next run will execute it. The
                         card is where that belongs — the operator looks for the
                         issue, not for a file. `.stop` for the same reason as the
                         run pill above: the parent opens the drawer, this opens
                         the plan. -->
                    <div class="kc-plan" x-show="planFor(iss.number)"
                         :class="{ warn: planPillWarns(iss.number) }"
                         @click.stop="openPlanModal()"
                         title="Open the plan for this issue">
                      <svg x-icon="'scroll-text'"></svg>
                      <span class="kc-plan-txt" x-text="planPillLabel(iss.number)"></span>
                    </div>
                    <div class="kc-labels" x-show="(iss.labels || []).length">
                      <template x-for="l in iss.labels" :key="l">
                        <span class="kc-label" :style="`background:${labelColor(l)};color:${labelInk(l)}`" x-text="labelShort(l)"></span>
                      </template>
                    </div>
                  </article>
                </template>
                <div class="kanban-col-empty" x-show="kanbanColumns()[col.id].length === 0">—</div>
              </div>
            </section>
          </template>
        </div>

        <!-- detail drawer: GitHub-style read-only view + the label editor -->
        <aside class="kanban-detail" :class="{ open: kanbanSel !== null && !!selectedIssue() }" aria-label="Issue detail">
          <template x-if="selectedIssue()">
            <div class="kd-inner">
              <div class="kd-head">
                <span class="kd-state" :class="selectedIssue().state === 'closed' ? (selectedIssue().reason || 'completed') : 'open'">
                  <i class="bi" :class="selectedIssue().state === 'closed'
                    ? (selectedIssue().reason === 'not_planned' ? 'bi-slash-circle' : 'bi-check-circle-fill')
                    : 'bi-record-circle'"></i>
                  <span x-text="selectedIssue().state === 'closed' ? closeLabel(selectedIssue()) : 'Open'"></span>
                </span>
                <span class="spacer"></span>
                <a class="kd-gh" x-show="githubUrl(selectedIssue().number)"
                   :href="githubUrl(selectedIssue().number)" target="_blank" rel="noopener"
                   title="Open on GitHub to edit. This board is read-only.">
                  <i class="bi bi-github"></i><span class="kd-gh-label"> Open on GitHub</span>
                </a>
                <!-- Two glyphs, one button: a wide pane closes with an X at the
                     trailing edge; a narrow pane (the drawer is the whole pane)
                     goes BACK from the leading edge, where a thumb reaches and
                     nothing can clip it. The stylesheet picks the glyph. -->
                <button class="kd-x" @click="closeIssue()" title="Close" aria-label="Close"><i class="bi bi-x-lg"></i><i class="bi bi-arrow-left"></i></button>
              </div>

              <h2 class="kd-title">
                <span class="kd-num" x-text="'#' + selectedIssue().number"></span>
                <span x-text="selectedIssue().title"></span>
              </h2>

              <!-- running banner -->
              <div class="kd-run" x-show="issueRunning(selectedIssue().number)">
                <span class="kd-run-face" x-text="issueRunning(selectedIssue().number)?.face"></span>
                <span x-text="issueRunning(selectedIssue().number)?.glyph"></span>
                <span x-text="issueRunningLabel(issueRunning(selectedIssue().number))"></span>
              </div>

              <!-- meta -->
              <div class="kd-meta">
                <div class="kd-meta-row"><span class="kd-k">Column</span><span class="kd-v" x-text="kanbanColumnTitle(selectedIssue())"></span></div>
                <div class="kd-meta-row"><span class="kd-k">Assignees</span><span class="kd-v" x-text="(selectedIssue().assignees || []).join(', ') || '—'"></span></div>
                <div class="kd-meta-row"><span class="kd-k">Opened</span><span class="kd-v" x-text="kfmtDate(selectedIssue().created)"></span></div>
                <div class="kd-meta-row"><span class="kd-k">Updated</span><span class="kd-v" x-text="kfmtDate(selectedIssue().updated)"></span></div>
              </div>

              <!-- blocked by -->
              <div class="kd-row" x-show="issueBlockers(selectedIssue()).length">
                <span class="kd-k">Blocked by</span>
                <div class="kd-blockers">
                  <template x-for="b in issueBlockers(selectedIssue())" :key="b.number">
                    <a class="kd-blocker" :class="{ open: b.open }" x-show="githubUrl(b.number)"
                       :href="githubUrl(b.number)" target="_blank" rel="noopener" :title="b.title">
                      <i class="bi" :class="b.open ? 'bi-lock-fill' : 'bi-unlock'"></i><span x-text="'#' + b.number"></span>
                    </a>
                  </template>
                </div>
              </div>

              <!-- labels — the one editable field -->
              <div class="kd-row">
                <span class="kd-k">Labels</span>
                <div class="kd-labels">
                  <template x-for="l in selectedIssue().labels" :key="l">
                    <span class="kd-label" :style="`background:${labelColor(l)};color:${labelInk(l)}`" x-text="l"></span>
                  </template>
                  <span class="kd-nolabel" x-show="(selectedIssue().labels || []).length === 0">No labels</span>
                  <button class="kd-label-edit" @click.stop="toggleLabelMenu()"
                          :disabled="labelsLocked()"
                          :title="labelLockReason() || 'Add or remove labels on this issue'"><svg x-icon="'tag'"></svg> Edit</button>
                  <!-- NOT a `.dropdown`: an absolutely-positioned menu here is
                       clipped by `.kd-inner`'s scroll and `.kanban-detail`'s
                       `overflow: hidden`, and with 16 labels it clipped on every
                       card past the middle of the drawer. In flow on its own row
                       (`flex-basis: 100%` inside the wrapping `.kd-labels`) it
                       cannot be clipped at all, and there is no position to keep
                       in step with the scroll. -->
                  <div class="kd-label-menu" x-show="labelMenuOpen" @click.outside="labelMenuOpen = false" x-cloak>
                    <div class="dropdown-head">Click a label to add or remove it</div>
                    <template x-for="l in KANBAN_LABELS" :key="'opt-' + l">
                      <button class="dropdown-item kd-label-opt" @click="toggleLabel(selectedIssue(), l)"
                              :disabled="labelsLocked()" :title="labelLockReason()">
                        <span class="kd-label-swatch" :style="`background:${labelColor(l)}`"></span>
                        <span class="kd-label-optname" x-text="l"></span>
                        <i class="bi bi-check2" x-show="hasLabel(selectedIssue(), l)"></i>
                      </button>
                    </template>
                  </div>
                </div>
              </div>

              <!-- a failed detail fetch: an empty drawer must never read as an
                   issue with no content (#302) -->
              <div class="kd-error" x-show="issueError">
                <svg x-icon="'alert-triangle'"></svg>
                <span x-text="issueError"></span>
              </div>

              <!-- body. The board fold carries `body: ""`, so between the click
                   and `issue.show` landing there is genuinely nothing to render —
                   and `_(empty)_` would state, wrongly, that the issue HAS no
                   body. Say "loading" for exactly that window. -->
              <div class="kd-loading" x-show="issueLoading && !selectedIssue().body">
                <span class="kanban-spinner" aria-hidden="true"></span> Loading issue…
              </div>
              <div class="kd-body md" x-show="!(issueLoading && !selectedIssue().body)"
                   x-html="renderIssueMd(selectedIssue().body)"></div>

              <!-- comments -->
              <div class="kd-comments" x-show="(selectedIssue().comments || []).length">
                <div class="kd-comments-head"
                     x-text="selectedIssue().comments.length + ' comment' + (selectedIssue().comments.length === 1 ? '' : 's')"></div>
                <template x-for="(c, idx) in selectedIssue().comments" :key="idx">
                  <div class="kd-comment">
                    <div class="kd-comment-head"><b x-text="c.author"></b><span class="kd-comment-at" x-text="kfmtDate(c.at)"></span></div>
                    <div class="kd-comment-body md" x-html="renderIssueMd(c.body)"></div>
                  </div>
                </template>
              </div>

              <div class="kd-foot">
                Read-only. Edit labels here; everything else on GitHub.
              </div>
            </div>
          </template>
        </aside>
      </section>

      <!-- Plan modal — the repo's READY plan, in full, with the one act it needs.
           A finalized `.ralphy/plan.md` is executed by the next run, so the
           operator has to be able to read it before that happens and throw it away
           if they have changed their mind. The verdict banner leads because it is
           the part that changes the decision: a `Feasible: no` or bundle plan is
           asking for a human, not for a run. Discard goes through `plan.discard`
           (ADR-0036 amendment) after the design-system confirm. -->
      <div class="modal-scrim" x-cloak x-bind="$store.modals.scrim('planModal.open', () => closePlanModal())">
        <div class="modal plan-modal" role="dialog" aria-modal="true" aria-label="Plan">
          <div class="modal-head">
            <svg x-icon="'scroll-text'"></svg>
            <span class="modal-title" x-text="'Plan · #' + (openPlan()?.summary?.issue ?? '')"></span>
            <span class="modal-sub" x-text="$store.projects.projectLabel($store.projects.openSlug)" :title="$store.projects.projectTitle($store.projects.openSlug)"></span>
            <span class="spacer"></span>
            <button class="modal-x" @click="closePlanModal()" title="Close"><i class="bi bi-x-lg"></i></button>
          </div>
          <!-- The verdict, stated before the prose. `infeasible` is the RUNNER's own
               test (zero open steps), not the heading's claim, so a plan that says
               "yes" with nothing to do reads here exactly as the loop will treat
               it. -->
          <template x-if="planVerdict()">
            <div class="plan-verdict" :class="{ warn: planVerdict().infeasible }">
              <div class="plan-verdict-head">
                <i class="bi" :class="planVerdict().infeasible ? 'bi-exclamation-triangle' : 'bi-check-circle'"></i>
                <b x-text="planVerdict().heading"></b>
                <span class="plan-verdict-chip" x-show="planVerdict().needsSplit">needs split</span>
                <span class="spacer"></span>
                <span class="plan-verdict-steps"
                      x-text="planVerdict().openSteps + ' of ' + planVerdict().steps + ' steps open'"></span>
              </div>
              <!-- The planner's own reasons — the thing a human is being asked to
                   act on. Never truncated: it is one or two sentences by contract. -->
              <p class="plan-verdict-why" x-show="planVerdict().reason" x-text="planVerdict().reason"></p>
              <p class="plan-verdict-why" x-show="!planVerdict().reason">
                This plan states no feasibility reason.
              </p>
            </div>
          </template>
          <div class="plan-doc md" x-html="renderPlanDoc()"></div>
          <div class="modal-foot">
            <span class="foot-note">The next run executes this plan for that issue.</span>
            <button class="btn" @click="closePlanModal()">Close</button>
            <button class="btn danger" data-act="plan-discard" :disabled="$store.connection.writeLocked()"
                    :title="discardTitle()" @click="discardPlan()">Discard plan</button>
          </div>
        </div>
      </div>
      </div>
