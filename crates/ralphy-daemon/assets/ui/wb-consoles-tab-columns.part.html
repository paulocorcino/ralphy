          <div x-data="wbColumns">
          <!-- FRAME chrome (issue #338, ADR-0051 §5): siblings of `#workspace`,
               never children of `#stage`. Inside the plane they would pan away
               with the content; here they resolve against `.consoles-tab` and
               stay put while the operator scrolls. -->
          <!-- The empty-stage hint ("No consoles open" + the New-console
               accelerator) was here. It is gone: the toolbar's own button says
               the same thing, permanently and in the place the operator acts,
               and an empty plane needs no caption to be legible. The count pill
               below already reports zero for anyone reading the frame. -->
          <!-- `x-cloak`: the pills carry a border and a background but no markup
               text, so without it two empty boxes flash on every load until
               Alpine binds `consoleCount`/`stageW`. -->
          <div class="canvas-foot" x-cloak>
            <span class="pill" x-text="consoleCount + (consoleCount === 1 ? ' console' : ' consoles')"></span>
            <span class="pill" x-text="'Stage ' + stageW + ' × ' + stageH"></span>
          </div>
          <!-- Slice (ADR-0051 §5): the list a maximized console's
               title bar opens. FRAME chrome like the footer, placed under the
               button that opened it. Rows stay `.column-item`, a class of their
               own, so queries scoped to the other menus stay inert. A row
               swaps its console in. The Right | Down pair on top decides
               where the open icon beside a row opens it (rows amendment). On
               a phone (Switch) the pair and the open icon are hidden. -->
          <div class="dropdown column-menu" x-show="columnMenu" @click.outside="columnMenu = false" x-cloak
               :style="`top: ${columnMenuAt.top}px; right: ${columnMenuAt.right}px; max-width: ${columnMenuAt.maxWidth}px; max-height: ${columnMenuAt.maxHeight}px`">
            <div class="column-dir" role="group" aria-label="Where the console opens" x-show="!columnSwitch">
              <button type="button" class="column-dir-btn" data-dir="right" :aria-pressed="columnDir === 'right'"
                      :class="{ on: columnDir === 'right' }" @click="setColumnDir('right')">
                <i class="bi bi-arrow-right"></i><span>Right</span>
              </button>
              <button type="button" class="column-dir-btn" data-dir="down" :aria-pressed="columnDir === 'down'"
                      :class="{ on: columnDir === 'down' }" @click="setColumnDir('down')">
                <i class="bi bi-arrow-down"></i><span>Down</span>
              </button>
            </div>
            <input class="column-filter" type="text" x-ref="columnFilter" x-show="columnFilterShown()"
                   x-model="columnFilter" placeholder="Filter" aria-label="Filter consoles"
                   @keydown.enter.prevent="swapFirstColumn()" @keydown.escape.prevent="columnMenu = false">
            <!-- Only the list scrolls: Right | Down and the filter stay on top. -->
            <div class="column-list">
              <template x-for="g in columnView()" :key="g.fence ? g.fence.id : '-loose'">
                <div class="column-group">
                  <!-- Consoles outside every fence have no head. -->
                  <div class="dropdown-head column-group-head" x-show="g.fence">
                    <span class="column-group-name" x-text="g.fence?.name"></span>
                  </div>
                  <!-- The row swaps the console into the column that opened
                       the list; the icon beside it opens a new column or row.
                       On a phone the icon is hidden. The key
                       holds the mode: MEASURED (Alpine 3.14.1, Chromium), a
                       row kept under the same key across a mode change showed
                       the previous list's values until the next open. -->
                  <template x-for="r in g.rows" :key="(columnSwitch ? 'switch ' : '') + r.id">
                    <div class="column-row">
                      <button class="column-item" :disabled="columnRowOff(r)" :title="columnRowTip(r)"
                              :data-id="r.id" @click="pickColumn(r.id)">
                        <i class="bi bi-terminal"></i>
                        <span class="row-name" x-text="columnRowLabel(r)"></span>
                        <span class="session-state" :class="r.state" x-show="r.state" :title="window.WBConsole?.agentStateTitle(r.state, r.detail)"></span>
                        <span class="row-off" x-show="!r.running">not running</span>
                      </button>
                      <button class="column-open" :disabled="!r.enabled" :data-id="r.id" x-show="!columnSwitch"
                              :title="columnOpenTip(r)" :aria-label="columnOpenTip(r)"
                              @click="openColumn(r.id)">
                        <i class="bi bi-arrows-expand-vertical"></i>
                      </button>
                    </div>
                  </template>
                </div>
              </template>
              <div class="column-empty" x-show="columnFilter && !columnView().length">No console matches</div>
            </div>
          </div>
          </div>
