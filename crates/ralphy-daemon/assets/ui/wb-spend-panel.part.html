        <section class="spend-tab" x-data="wbSpend" @workbench:spend-open.window="openSpend()" x-show="$store.tabs.active === 'spend'" x-cloak x-effect="spendModel = spendView()">
          <!-- The strip is OUTSIDE the state branches: the operator must be able
               to tell a Spend tab with nothing to show from a tab that failed to
               load, and a header that disappears with its content makes the pane
               read as broken in exactly the state that is not. -->
          <header class="spend-bar">
            <span class="spend-eyebrow">Spend</span>
            <span class="spend-sep" x-show="$store.projects.openSlug">/</span>
            <span class="spend-project" x-text="$store.projects.projectLabel($store.projects.openSlug)" :title="$store.projects.projectTitle($store.projects.openSlug)" x-show="$store.projects.openSlug"></span>
            <!-- Overview | Ledger · two readings of ONE project, so they are two
                 panes of one tab and not two tabs. The Ledger side is what the
                 removed Usage modal did, with columns and scoped to the project
                 the summary above it is already about. -->
            <div class="spend-pane-toggle" x-show="$store.projects.openSlug" role="group" aria-label="Spend pane">
              <button data-pane="overview" :class="{ active: spendPane === 'overview' }"
                      :aria-pressed="spendPane === 'overview'" @click="setSpendPane('overview')">Overview</button>
              <button data-pane="ledger" :class="{ active: spendPane === 'ledger' }"
                      :aria-pressed="spendPane === 'ledger'" @click="setSpendPane('ledger')">Ledger</button>
            </div>
            <!-- The window, as a control rather than a caption. An unlabelled
                 total invites the reader to assume a window it does not have,
                 and the daemon refuses a key that is not in this list — the
                 vocabulary is one closed set on both sides. -->
            <!-- Overview only: the window scopes the SUMMARY's figures, and a
                 "last 7 days" label above an all-time grid is exactly the
                 misread the closed vocabulary exists to prevent. -->
            <select class="spend-period-select" x-show="$store.projects.openSlug && spendPane === 'overview'" aria-label="Spend period"
                    @change="setSpendPeriod($event.target.value)">
              <template x-for="p in spendModel.periods.list" :key="p.key">
                <option :value="p.key" :selected="p.key === spendModel.periods.key" x-text="p.label"></option>
              </template>
            </select>
            <span class="spend-bar-spacer"></span>
            <!-- Refreshes the pane the operator is LOOKING at: the two panes are
                 two different reads of the ledger, and a button that re-fetched
                 the invisible one would read as broken. -->
            <button class="side-refresh" :class="{ spinning: spend.loading || ledger.loading }"
                    :disabled="spend.loading || ledger.loading || !$store.projects.openSlug"
                    @click="spendPane === 'ledger' ? (ledger.slug = null, loadLedger()) : loadSpend()"
                    title="Refresh" aria-label="Refresh spend">
              <svg x-icon="'refresh-cw'"></svg>
            </button>
          </header>

          <template x-if="spendModel.kind === 'empty'">
            <div class="spend-blank">
              <svg x-icon="'coins'" class="spend-blank-icon"></svg>
              <p class="spend-blank-title" x-text="spendModel.message"></p>
              <p class="spend-blank-hint" x-text="spendModel.hint"></p>
            </div>
          </template>

          <template x-if="spendModel.kind === 'loading' && spendPane === 'overview'">
            <div class="spend-blank"><p class="spend-blank-hint">Reading the ledger…</p></div>
          </template>

          <template x-if="spendModel.kind === 'error' && spendPane === 'overview'">
            <div class="spend-blank">
              <p class="spend-blank-title" x-text="spendModel.message"></p>
              <button class="btn" @click="loadSpend()">Retry</button>
            </div>
          </template>

          <template x-if="spendModel.kind === 'ready'">
            <div class="spend-body" x-show="spendPane === 'overview'">
              <!-- KPI STRIP · the executive read, as a ROW OF TILES rather than
                   one wide band. PRD #355 fixes the shape — "five tiles carry
                   the executive read: total cost as a floor, deliveries, cost
                   per delivery, retry burn, cache hit" — and this slice carries
                   the first of the five. The strip is deliberately not full of
                   tiles yet: #359 appends the other four into the same row, and
                   a band would have had to be demolished to make room for them.

                   Total cost is the PRIMARY tile: wider, and the only figure on
                   the page at display size. That asymmetry is the point — the
                   other four qualify this one, they do not compete with it. -->
              <div class="kpi-strip">
                <section class="kpi kpi-primary">
                  <span class="spend-label">Total cost</span>
                  <span class="spend-figure" :class="{ floor: spendModel.floor }" x-text="spendModel.total"></span>
                  <!-- The `+` is inside the daemon's string; this is what it
                       MEANS, named in words, because a symbol teaches nobody on
                       its own and this one is the difference between a bill and
                       a lower bound. -->
                  <span class="spend-caveat" x-show="spendModel.floor" x-text="spendModel.floorNote"></span>

                  <!-- COVERAGE · how much of the volume the figure above it
                       actually priced. It lives INSIDE the tile because it is a
                       claim about this figure and no other, and drawn only once
                       something is missing — a full-width bar at 100% would be
                       decoration saying what the absent floor marker said. -->
                  <div class="spend-coverage" x-show="spendModel.coverage.show">
                    <div class="cov-track" role="img"
                         :aria-label="'Priced ' + spendModel.coverage.pricedLabel + ', unpriced ' + spendModel.coverage.unpricedLabel">
                      <span class="cov-priced" :style="'width:' + spendModel.coverage.priced"></span>
                      <span class="cov-unpriced" :style="'width:' + spendModel.coverage.unpriced"></span>
                    </div>
                    <div class="cov-legend">
                      <span class="cov-key"><i class="cov-dot priced"></i>
                        <b x-text="spendModel.coverage.pricedLabel"></b> priced
                        <em x-text="spendModel.coverage.pricedVolume"></em>
                      </span>
                      <span class="cov-key"><i class="cov-dot unpriced"></i>
                        <b x-text="spendModel.coverage.unpricedLabel"></b> unpriced
                        <em x-text="spendModel.unpriced.label"></em>
                      </span>
                    </div>
                  </div>
                </section>

                <!-- The other four of PRD #355's five. They QUALIFY the primary
                     tile — how many issues, what one costs, how much bought
                     nothing, how much came back from cache — so they share its
                     strip at a smaller size rather than opening a second band.
                     Every figure is a string the daemon rendered. -->
                <template x-for="t in spendModel.tiles.filter((t) => !t.primary)" :key="t.key">
                  <section class="kpi">
                    <span class="spend-label" x-text="t.label"></span>
                    <span class="kpi-figure" :class="{ floor: t.floor }" x-text="t.value"></span>
                    <span class="kpi-note" x-text="t.note"></span>
                  </section>
                </template>
              </div>

              <!-- ACTIVITY BAND · spend and deliveries on ONE timeline, so a
                   spike in cost can be read against what it bought that day.
                   Full width, directly under the strip: it is the bridge from
                   the executive figures to the two grids that explain them.

                   The two series have no common unit, so each bar is drawn
                   against ITS OWN peak day. A shared axis would silently claim
                   dollars and issues are comparable quantities. -->
              <section class="spend-band" x-show="spendModel.band.show">
                <header class="spend-panel-head">
                  <span class="spend-label">Activity</span>
                  <span class="spend-panel-note" x-text="spendModel.periodLabel"></span>
                </header>
                <ul class="band-days">
                  <template x-for="d in spendModel.band.days" :key="d.key">
                    <li class="band-day" :class="{ quiet: d.quiet }"
                        :title="d.title">
                      <span class="band-bars">
                        <span class="band-usd" :style="'height:' + d.usdHeight"></span>
                        <span class="band-deliveries" :style="'height:' + d.deliveriesHeight"></span>
                      </span>
                      <span class="band-date" x-text="d.short"></span>
                    </li>
                  </template>
                </ul>
                <p class="band-legend">
                  <span class="band-key"><i class="band-dot usd"></i> Spend</span>
                  <span class="band-key"><i class="band-dot deliveries"></i> Deliveries</span>
                </p>
              </section>

              <div class="spend-cols">
                <!-- DELIVERIES · what each issue cost, costliest first. The
                     title is an ADORNMENT read from whatever the board already
                     holds: a cold board shows `#251` alone, and nothing here
                     reaches for one — the board fold spawns a CLI that makes
                     tracker calls, and a cost page must never pay it. -->
                <section class="spend-panel">
                  <header class="spend-panel-head">
                    <span class="spend-label">Deliveries</span>
                    <!-- Named, because the models panel beside this one shows
                         percentages of a DIFFERENT whole. Two bare `%` columns
                         side by side invite the reader to compare them. -->
                    <span class="spend-panel-note">Share of the delivery column</span>
                    <span class="spend-panel-figure"
                          x-text="spendModel.overheadLines[0].value"></span>
                  </header>
                  <ul class="delivery-rows">
                    <template x-for="d in spendModel.deliveryRows" :key="d.issue">
                      <li class="delivery-row">
                        <div class="delivery-line">
                          <span class="delivery-issue" x-text="d.label"></span>
                          <span class="delivery-title" x-text="d.title" x-show="d.title"></span>
                          <!-- How many runs executed this issue. A failed attempt
                               cost real money and is inside the figure beside it,
                               so the count is what explains the figure. -->
                          <span class="delivery-attempts" x-show="d.attempts > 0"
                                :title="d.attempts === 1 ? '1 execute attempt' : d.attempts + ' execute attempts'">⟳<span x-text="d.attempts"></span></span>
                          <span class="delivery-value" :class="{ floor: d.floor }" x-text="d.value"></span>
                          <span class="delivery-share" x-text="d.share"></span>
                        </div>
                        <span class="delivery-track"><span class="delivery-fill" :style="'width:' + d.width"></span></span>
                      </li>
                    </template>
                  </ul>
                  <p class="delivery-truncated" x-show="spendModel.deliveriesTruncated > 0">
                    <span x-text="spendModel.deliveriesTruncated"></span>
                    more issue(s) not listed. Totals include them.
                  </p>

                  <!-- OVERHEAD · the three lines that sum to the total, BESIDE
                       the rows and never among them: an overhead line inside the
                       grid would read as an issue that cost that much. -->
                  <div class="spend-overhead">
                    <template x-for="o in spendModel.overheadLines" :key="o.key">
                      <p class="overhead-line">
                        <span class="overhead-label" x-text="o.label"></span>
                        <span class="overhead-note" x-text="o.note"></span>
                        <span class="overhead-value" :class="{ floor: o.floor }" x-text="o.value"></span>
                      </p>
                    </template>
                  </div>
                </section>

                <!-- MODELS · which engine the money went to. The volume no model
                     could be named for is a ROW here, never a hole: a grid that
                     hid it would contradict the unpriced panel below. -->
                <section class="spend-panel">
                  <header class="spend-panel-head">
                    <span class="spend-label">Models</span>
                    <span class="spend-panel-note">Share of the project</span>
                    <span class="spend-panel-figure" x-text="spendModel.total"></span>
                  </header>
                  <ul class="model-rows">
                    <template x-for="m in spendModel.modelRows" :key="m.key">
                      <li class="model-row" :class="{ unpriced: !m.priced }">
                        <div class="model-line">
                          <span class="model-name" x-text="m.model"></span>
                          <span class="model-tokens" x-text="m.tokens"></span>
                          <span class="model-value" :class="{ floor: m.floor }" x-text="m.value"></span>
                          <span class="model-share" x-text="m.share"></span>
                        </div>
                        <span class="model-track"><span class="model-fill" :style="'width:' + m.width"></span></span>
                      </li>
                    </template>
                  </ul>
                </section>
              </div>

              <div class="spend-cols">
                <!-- TOKENS · the same four counts the terminal footer prints,
                     laid out so they can be COMPARED rather than only read.
                     Each bar is drawn against the largest kind, not against the
                     total: at 90%/3%/3%/4% the three small ones would be
                     invisible slivers, and comparison is the whole job. -->
                <section class="spend-panel">
                  <header class="spend-panel-head">
                    <span class="spend-label">Tokens</span>
                    <span class="spend-panel-figure" x-text="spendModel.tokensTotal"></span>
                  </header>
                  <ul class="meter-rows">
                    <template x-for="r in spendModel.meterRows" :key="r.key">
                      <li class="meter-row" :class="{ empty: r.empty }">
                        <span class="meter-glyph" x-text="r.glyph"></span>
                        <span class="meter-name" x-text="r.name"></span>
                        <span class="meter-track"><span class="meter-fill" :style="'width:' + r.width"></span></span>
                        <span class="meter-value" x-text="r.value"></span>
                        <span class="meter-share" x-text="r.share"></span>
                      </li>
                    </template>
                  </ul>
                  <!-- The canonical one-liner is kept BELOW the rows, not
                       instead of them: it is the string the operator already
                       reads in the terminal, and seeing the two together is what
                       makes the web and the CLI one vocabulary rather than two
                       presentations that happen to agree. -->
                  <p class="meter-line" x-text="spendModel.meter"></p>
                </section>

                <!-- UNPRICED · a FIRST-CLASS element, not a footnote. It stays
                     visible enough to get fixed, and it doubles as a health
                     metric for Ralphy's own instrumentation (PRD #355): when it
                     reaches zero the total becomes trustworthy, and the operator
                     learns that the moment it happens instead of guessing. -->
                <section class="spend-panel gap" x-show="spendModel.unpriced.any">
                  <header class="spend-panel-head">
                    <span class="spend-label">Unpriced volume</span>
                    <!-- The figure IS the drill-down (PRD #355 story 25): the gap
                         gets a concrete owner — the offending rows — instead of
                         staying a number nobody can act on. Same classes and the
                         same text node as the span it replaced, so the reading
                         does not change, only what clicking it does. -->
                    <button class="spend-panel-figure gold unpriced-drill" @click="showUnpricedLedger()"
                            title="Show the unpriced rows" x-text="spendModel.unpriced.label"></button>
                    <span class="spend-panel-note" x-show="spendModel.unpriced.share"
                          x-text="spendModel.unpriced.share + ' of this project’s tokens'"></span>
                  </header>
                  <ul class="cause-rows">
                    <template x-for="c in spendModel.unpriced.causes" :key="c.key">
                      <li class="cause-row" :class="'cause-' + c.key">
                        <div class="cause-line">
                          <span class="cause-title" x-text="c.title"></span>
                          <span class="cause-value" x-text="c.value"></span>
                          <span class="cause-share" x-text="c.share"></span>
                        </div>
                        <span class="cause-track"><span class="cause-fill" :style="'width:' + c.width"></span></span>
                        <!-- The hint is always on screen, never a tooltip: which
                             half of the gap is worth working on is the reason
                             the split exists, and a title attribute hides it
                             from the reader who most needs it. -->
                        <p class="cause-hint" x-text="c.hint"></p>
                      </li>
                    </template>
                  </ul>
                  <p class="cause-unmetered" x-show="spendModel.unpriced.unmetered > 0">
                    <span x-text="spendModel.unpriced.unmetered"></span>
                    interactive session(s) with no token count. Their cost is unknown.
                  </p>
                </section>
              </div>
            </div>
          </template>

          <!-- THE LEDGER PANE (#360) · the raw per-phase grid — what the removed
               Usage modal did, with columns. Everything here is a `.ledger-*`
               class and nothing reuses `.spend-panel*`: a sibling `.spend-panel`
               has already silently retargeted an earlier suite's unscoped
               selector, and the two panes are read by different assertions.

               One row per ledger line, capped: the grid is DOM that grows with
               the project's history, while every FIGURE on the Overview is folded
               server-side over every row. The cap bounds the list, never a total.
               -->
          <section class="ledger-pane" x-show="spendPane === 'ledger'" x-cloak x-effect="ledgerModel = ledgerView()">
            <!-- A peer whose usage never arrived. It lives HERE and not on the
                 Overview because it is a statement about COMPLETENESS of the raw
                 rows, and it is the only surface that carries it. -->
            <div class="ledger-missing" x-show="ledgerModel.missing.length">
              <h4>Usage missing from some daemons</h4>
              <template x-for="peer in ledgerModel.missing" :key="peer.daemon_id">
                <p class="ledger-missing-row">
                  <strong x-text="peer.environment || 'Another computer'"></strong>
                  <span x-text="peer.why || 'Usage unavailable'"></span>
                </p>
              </template>
            </div>

            <div class="ledger-bar">
              <!-- The filter is a CHIP the operator can see and clear, never a
                   hidden mode: arriving here from the unpriced figure with a
                   silently filtered grid would read as "the ledger is 2 rows". -->
              <span class="ledger-chip" x-show="ledgerModel.unpricedOnly">
                Unpriced only
                <button class="ledger-chip-clear" @click="spendLedgerUnpricedOnly = false"
                        aria-label="Clear the unpriced filter">×</button>
              </span>
              <span class="ledger-count" x-show="ledgerModel.kind === 'ready'">
                <span x-text="ledgerModel.rows.length"></span> rows
              </span>
            </div>

            <p class="ledger-blank" x-show="ledgerModel.kind === 'loading'">Reading the ledger…</p>
            <p class="ledger-blank" x-show="ledgerModel.kind === 'error'" x-text="ledgerModel.message"></p>
            <!-- The banner above stays reachable with no project open — a peer
                 whose usage never arrived is fleet health, and this pane is its
                 only surface now the Usage modal is gone. -->
            <p class="ledger-blank" x-show="ledgerModel.kind === 'empty'" x-text="ledgerModel.hint"></p>

            <table class="ledger-grid" x-show="ledgerModel.kind === 'ready'">
              <thead>
                <tr>
                  <template x-for="c in ledgerModel.columns" :key="c.key">
                    <th :class="'ledger-col-' + c.key" x-text="c.label"></th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="(r, i) in ledgerModel.rows" :key="i">
                  <tr class="ledger-row" :class="{ unpriced: !!r.unpriced, floor: r.lowerBound }">
                    <td class="ledger-col-kind">
                      <span x-text="r.kindLabel"></span><span class="ledger-bound" x-text="r.boundNote"></span>
                      <!-- WHY this row is unpriced, in the daemon's own word.
                           The class alone would say only "something is wrong
                           here", and recoverable vs lost is the whole reason the
                           split exists (ADR-0053 D4). -->
                      <span class="ledger-cause" x-show="r.unpriced" x-text="r.unpricedLabel"></span>
                    </td>
                    <td class="ledger-col-issue" x-text="r.issue"></td>
                    <td class="ledger-col-phase" x-text="r.phase"></td>
                    <td class="ledger-col-agent" x-text="r.agent"></td>
                    <td class="ledger-col-model" x-text="r.model"></td>
                    <td class="ledger-col-outcome" x-text="r.outcome"></td>
                    <td class="ledger-col-actor" x-text="r.actor"></td>
                    <td class="ledger-col-version" x-text="r.version"></td>
                    <td class="ledger-col-when" x-text="r.whenLabel" :title="r.when"></td>
                    <td class="ledger-num" x-text="r.tokens.input"></td>
                    <td class="ledger-num" x-text="r.tokens.cache_read"></td>
                    <td class="ledger-num" x-text="r.tokens.cache_creation"></td>
                    <td class="ledger-num" x-text="r.tokens.output"></td>
                  </tr>
                </template>
              </tbody>
            </table>

            <p class="ledger-empty" x-show="ledgerModel.kind === 'ready' && ledgerModel.rows.length === 0">
              No rows.
            </p>
            <!-- The cap bounds this LIST and no figure: the Overview's totals are
                 folded server-side over every row in the window. Says exactly
                 that and no more — the older claim, that the two surfaces read
                 one population, is not true of peer rows (see below). -->
            <p class="ledger-note" x-show="ledgerModel.truncated > 0">
              <span x-text="ledgerModel.truncated"></span> older rows not shown. Totals include them.
            </p>
            <!-- The one difference the page cannot remove, NAMED rather than left
                 for the operator to find in a count that will not add up:
                 `/api/usage` folds the fleet, `/api/spend` is local only. -->
            <p class="ledger-note" x-show="ledgerModel.peers > 0">
              <span x-text="ledgerModel.peers"></span> rows from another daemon. Not counted in “Overview”.
            </p>
            <p class="ledger-note" x-show="ledgerModel.anyLowerBound">A value with “&#8805;” means that the real cost is at least this amount.</p>
          </section>
        </section>
