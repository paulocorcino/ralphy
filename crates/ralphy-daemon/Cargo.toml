[package]
name = "ralphy-daemon"
version = "0.1.0-rc.27"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ralphy's resident daemon: a localhost HTTP listener serving the embedded workbench UI (docs/adr/0032). The workspace's only async (tokio + axum) crate — the runtime is confined here."

[dependencies]
anyhow.workspace = true
include_dir.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# ulid `serde` lets `id` serialize as its 26-char string in daemon.toml.
ulid = { workspace = true, features = ["serde"] }
# The workspace's first — and only — async stack (ADR-0032 §10): narrow tokio
# features, not `full`; axum carries HTTP now and the WebSocket upgrade later.
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync"] }
axum = { version = "0.8", features = ["ws"] }
# The local fleet's ONE HTTP client seam (ADR-0052 §2): hyper over a plain TCP
# connector, no TLS stack — a peer is dialled over loopback only. `client-legacy`
# is hyper-util's POOLED client: a dial per request cost the dialling host an
# ephemeral port per request, held in TIME_WAIT, which drained a Windows host's
# port pool against its WSL peer (2026-09-01, see peer/client.rs `pool`). All
# two are ALREADY in Cargo.lock as axum's own tree (hyper-util 0.1.20,
# http-body-util 0.1.3) and the added features pull no new crate either;
# `reqwest` would drag a whole TLS stack in for a 127.0.0.1 GET. `hyper` itself
# is no longer a DIRECT dependency: nothing names it since the pool replaced the
# hand-driven `client::conn::http1` handshake.
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
# The session manager drives a real PTY child (ralphy-pty) and resolves the agent
# program cross-platform (ralphy-proc-util); neither pulls in ralphy-core.
ralphy-pty.workspace = true
ralphy-proc-util.workspace = true
# The stateless usage scan (ADR-0033 §7): sync, no tokio, no ralphy-core — the
# daemon joins its interactive records onto the ledger's run records.
ralphy-usage-scan.workspace = true
# The read-time price table (ADR-0034 D6, extracted by #357): the ONE pricing
# implementation the CLI footer and the daemon's spend fold share, so the web and
# the terminal can never disagree about money. Sync and vendor-neutral — it sits
# on neither side of the ADR-0002 core/adapter seam, so this edge is allowed.
ralphy-pricing.workspace = true
ralphy-release.workspace = true
# The run-snapshot channel's shared document + reader (ADR-0047 §10): the leaf
# crate the CLI writes and the daemon lists `runs.list` from; serde only.
ralphy-run-snapshot.workspace = true
# `terminal_size()` lets the session_test_child observe PTY resizes; a normal dep
# (not dev) because src/bin/ targets don't see [dev-dependencies].
terminal_size = "0.4"
# CSPRNG for the access token (ADR-0032 §4); "0.4" is the version tempfile and
# uuid already pull, so no new transitive tree.
getrandom = "0.4"
# Browser-session auth (issue #179, ADR-0032 §4): TOTP (RFC 6238), a signed
# stateless session cookie, and an optional PBKDF2 password.
# `hmac`, `sha1` and `pbkdf2` share one `digest 0.10` tree with the `sha1` that
# axum's `ws` feature and tungstenite pull, so moving them to `digest 0.11` alone
# adds a second tree (#443).
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
subtle = "2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# `default-features = false` drops the `image`/`svg` renderers — only the pure
# unicode string render is used, so no image/bytemuck transitive tree.
qrcode = { version = "0.14", default-features = false }
# The CSP script hashes (security audit 2026-09-21, F3): sha256 over the
# shells' inline `<script>` bodies, derived once at first use from the embedded
# HTML. `sha2 0.10` is already in Cargo.lock through the RustCrypto tree.
sha2 = "0.10"
# The embedded UI's gzip body (`assets.rs`); the `ETag` reuses `sha2` above.
# Also the `.note` container's raw deflate (`note.rs`, ADR-0064 §3).
flate2.workspace = true
# Never-descend-noise tree listing for the Observe read path (ADR-0036 §4);
# ripgrep's walker, with every standard filter (gitignore, hidden) turned OFF —
# see the 2026-07-26 amendment.
ignore = "0.4"
# The literal, case-insensitive matcher behind `tree.grep` (ADR-0036, amendment
# 2026-09-15): the query is `regex::escape`d, so the crate is the matcher, never
# a syntax the operator writes.
regex.workspace = true
# Bytes ⇄ text at the file verbs (ADR-0036, amendment 2026-09-22): the Gecko
# decoder, every WHATWG encoding under the labels a browser already knows, pure
# Rust (its transitive tree at 0.8.41: `cfg-if`, `core_detect` and the
# `multiversion` SIMD-dispatch proc-macro).
encoding_rs = "0.8"
# The live file-tree watcher (ADR-0036 §4, issue #196): `notify` is the OS event
# backend (inotify/FSEvents/ReadDirectoryChangesW) and `notify-debouncer-full` is
# the coalescer that settles an event storm into few nudges.
notify = "8"
notify-debouncer-full = "0.7"
# The local-fleet PTY hop reuses the browser session WebSocket protocol. This is
# the one duplex transport at the peer-client seam; peers remain loopback-only.
tokio-tungstenite = "0.29"
futures-util = "0.3"
# The Spend view's period boundary (#359): the ROUTE turns `7d` into an RFC3339
# `since`, and the activity band walks civil dates to zero-fill a window's quiet
# days. The fold itself stays clock-free — it only compares against the instant
# it was handed. Already a workspace dependency, so this costs no new tree.
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
# Same reason as `windows-sys` below: the PTY test child clears the line
# discipline's ISIG/ICANON/ECHO so ETX reaches its reader as a byte. A normal
# dep, not a dev one, because src/bin/ targets don't see [dev-dependencies].
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The portable PTY test child enters raw console-input mode so its byte reader
# observes ETX exactly as a real agent TUI does under ConPTY.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
# Drive the Router in-process (`ServiceExt::oneshot`) — no sockets in unit tests.
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
# Seed an `opencode.db` fixture for the OpenCode interactive-usage integration test.
rusqlite.workspace = true
