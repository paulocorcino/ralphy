[package]
name = "ralphy-proc-util"
version = "0.1.0-rc17"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Leaf crate for Ralphy process/path resolution: PATH/PATHEXT program search, ~/.local/bin fallback, and the vendor-specific locators and spawn-time gates that both the adapters and the core-free daemon must agree on."

[dependencies]
anyhow.workspace = true
tracing.workspace = true

# Liveness probe for `pid::pid_is_alive`: one syscall per platform, so two tiny
# cfg-split crates instead of the sysinfo tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
