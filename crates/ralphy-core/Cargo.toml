[package]
name = "ralphy-core"
version = "0.1.0-rc.27"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Execution-mode-agnostic core for Ralphy: domain types, the Agent contract, and the run lifecycle."

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ralphy-proc-util.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
tempfile.workspace = true
tracing.workspace = true
os_info.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
# NTFS junctions for `worktree.share`: a directory link any user may create,
# where a symlink needs Developer Mode or a privilege.
junction = "2"
