name: Release

on:
  push:
    tags:
      - "v*"
  # Build the packages on demand (uploaded as run artifacts only; no GitHub
  # Release is published unless the run was triggered by a v* tag).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only by default. Only the publish job can write.
permissions:
  contents: read

jobs:
  # The product is built and tested here, on Linux, macOS and Windows, not
  # on a pull request (ci.yml): a pull request runs only the checks that build
  # no product crate, and the gate in AGENTS.md runs locally. The Windows
  # tests hang at times (#441). The packages are built only when all six
  # jobs pass.
  windows-test:
    name: build · test (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: read # checkout
      issues: write # the hang sampler posts to #441
    # A healthy Windows job took 23 min on 2026-09-25 (build ~10, tests ~10),
    # with a cargo cache; this workflow has none (see `build`).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest

      # The `ci` profile, as in linux-test: `release` without its link cost.
      - name: Build
        run: cargo build --locked --workspace --profile ci --all-targets

      # The Windows tests sometimes hang, and then nothing on the runner ends
      # the step: not nextest's kill, not the script's timer, not
      # `timeout-minutes` (#441). The script bounds the run, names and kills
      # what a test left alive, and starts a sampler that posts the state of a
      # slow run to #441 while it runs, because the job's log is lost.
      - name: Test
        timeout-minutes: 18
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # PTY tests drive cmd.exe on Windows (portable-pty).
        run: ./.github/scripts/nextest-windows.ps1 -TimeoutMinutes 14; exit $LASTEXITCODE

      - name: Doctests
        run: cargo test --locked --workspace --profile ci --doc

  windows-install:
    name: install script (windows-latest)
    # The one-line install (ADR-0056 §12) against a fake release packed from
    # this commit's binary and served on loopback; install.sh is checked by
    # linux-install and macos-install.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --locked --bin ralphy

      # A hosted Windows runner is elevated, so this is the administrator path:
      # it stops with no terminal, and with RALPHY_ALLOW_ROOT it registers the
      # daemon without starting it.
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RALPHY_RELEASES_URL: http://127.0.0.1:8765/releases
          RALPHY_DOWNLOAD_URL: http://127.0.0.1:8765/download
          RALPHY_INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'release'
          python .github/scripts/install-fixture.py target/debug/ralphy.exe windows-x64 $release
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $release -PassThru
          foreach ($i in 1..50) {
            try { Invoke-WebRequest -UseBasicParsing $env:RALPHY_RELEASES_URL | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
          }
          $refused = '' | pwsh -NoProfile -File assets/install/install.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 ran elevated with no terminal and no RALPHY_ALLOW_ROOT' }
          if ($refused -notmatch 'no terminal to ask in') { throw "refused for another reason: $refused" }
          $env:RALPHY_ALLOW_ROOT = '1'
          $installed = pwsh -NoProfile -File assets/install/install.ps1 -Daemon 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed ($LASTEXITCODE): $installed" }
          & "$env:RALPHY_INSTALL_DIR\ralphy.exe" --version
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v ralphy-daemon
          if ($LASTEXITCODE -ne 0) { throw 'the daemon autostart is not registered' }
          if ($installed -notmatch 'not started from this administrator window') { throw "no refusal line: $installed" }
          $running = Get-CimInstance Win32_Process -Filter "Name = 'ralphy.exe'" |
            Where-Object { $_.CommandLine -match ' daemon' }
          if ($running) { throw 'an elevated install started the daemon' }
          # The same script through Invoke-Expression, as the README runs it.
          Get-Content -Raw assets/install/install.ps1 | Invoke-Expression
          # A wrong checksum installs nothing.
          $sum = Join-Path $release 'download\v0.0.0-fixture\ralphy-v0.0.0-fixture-windows-x64.zip.sha256'
          Set-Content $sum '0000  x'
          $env:RALPHY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'badbin'
          $bad = pwsh -NoProfile -File assets/install/install.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 accepted a wrong checksum' }
          if ($bad -notmatch 'SHA-256 of') { throw "refused for another reason: $bad" }
          if (Test-Path (Join-Path $env:RALPHY_INSTALL_DIR 'ralphy.exe')) { throw 'a binary was installed' }
          Stop-Process -Id $server.Id
          # The runner ends the step with the last native exit code, which is the
          # refused install above.
          exit 0

  linux-test:
    name: build · test (ubuntu-latest)
    runs-on: ubuntu-latest
    # A wedged test used to consume the whole job budget until the hosted
    # runner died ("lost communication"), which uploads no log at all. The
    # Test step carries its own, shorter bound (#441).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest

      # `--profile ci` is `release` without its ship-only link cost (Cargo.toml):
      # under `lto`/`codegen-units = 1` the workspace's ~50 test binaries took
      # over 20 minutes to link. `--all-targets` builds the test binaries here,
      # so the Test step times tests and a compile blowup never reads as a hang.
      - name: Build
        run: cargo build --locked --workspace --profile ci --all-targets

      # The Linux hang has the same signature as memory or disk exhaustion, so
      # sample both alongside the tests. The sampler runs inside the Test step
      # because a step killed by its `timeout-minutes` skips the later steps:
      # only this step's log carries the samples.
      - name: Test
        timeout-minutes: 18
        # PTY tests drive sh on Linux (portable-pty).
        run: |
          ( while true; do
              echo "--- resources $(date -u +%H:%M:%S) ---"
              free -m | head -2
              df -h / | tail -1
              sleep 60
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null' EXIT
          cargo nextest run --locked --workspace --cargo-profile ci --no-fail-fast

      - name: Doctests
        run: cargo test --locked --workspace --profile ci --doc

  linux-install:
    name: install script (ubuntu-latest)
    # The one-line install (ADR-0056 §12) against a fake release packed from
    # this commit's binary and served on loopback, so no real release is read.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --locked --bin ralphy

      - name: Lint install.sh
        run: shellcheck assets/install/install.sh .github/scripts/check-install-sh.sh

      - name: install.sh
        env:
          RALPHY_RELEASES_URL: http://127.0.0.1:8765/releases
          RALPHY_DOWNLOAD_URL: http://127.0.0.1:8765/download
          RALPHY_INSTALL_DIR: ${{ runner.temp }}/bin
        run: ./.github/scripts/check-install-sh.sh

  macos-test:
    name: build · test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest

      # The `ci` profile, as in linux-test: `release` without its link cost.
      - name: Build
        run: cargo build --locked --workspace --profile ci --all-targets

      - name: Test
        timeout-minutes: 18
        # PTY tests drive sh on macOS, as on Linux (portable-pty).
        run: cargo nextest run --locked --workspace --cargo-profile ci --no-fail-fast

      # The only place `launchctl` runs for real (ADR-0032, amendment
      # 2026-09-15): a hosted macOS runner is a logged-in GUI session, so the
      # `gui/$UID` domain the agent bootstraps into exists. Proves the
      # register → probe → unregister round trip and that a second install is
      # a no-op, which no unit test can. A scratch HOME keeps the runner's own
      # LaunchAgents untouched and the daemon un-baptized, so nothing serves.
      - name: Autostart smoke (launchd)
        env:
          HOME: ${{ runner.temp }}/ralphy-home
        run: |
          set -euxo pipefail
          mkdir -p "$HOME"
          bin=target/ci/ralphy
          "$bin" daemon status | grep -q 'autostart: not registered'
          "$bin" daemon install
          "$bin" daemon install   # a re-install is a no-op, not a bootstrap error
          "$bin" daemon status | grep -q 'autostart: registered'
          test -f "$HOME/Library/LaunchAgents/dev.ralphy.daemon.plist"
          "$bin" daemon uninstall
          "$bin" daemon uninstall # idempotent
          "$bin" daemon status | grep -q 'autostart: not registered'
          test ! -e "$HOME/Library/LaunchAgents/dev.ralphy.daemon.plist"

      - name: Doctests
        run: cargo test --locked --workspace --profile ci --doc

  macos-install:
    name: install script (macos-latest)
    # install.sh against a fake release, as linux-install runs it, plus the
    # launchd agent that RALPHY_DAEMON=1 registers.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --locked --bin ralphy

      - name: install.sh
        env:
          RALPHY_RELEASES_URL: http://127.0.0.1:8765/releases
          RALPHY_DOWNLOAD_URL: http://127.0.0.1:8765/download
          RALPHY_INSTALL_DIR: ${{ runner.temp }}/bin
        run: ./.github/scripts/check-install-sh.sh

  build:
    name: Build ${{ matrix.target_name }}
    needs:
      [linux-test, linux-install, macos-test, macos-install, windows-test, windows-install]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-x64
            target: x86_64-pc-windows-msvc
            bin: ralphy.exe
            archive: zip
          - os: ubuntu-latest
            target_name: linux-x64
            # Static musl build: no glibc dependency, so the released binary runs
            # on any Linux distro (the default glibc build floors at the runner's
            # glibc, e.g. 2.39 on ubuntu-latest, and fails on older LTS releases).
            target: x86_64-unknown-linux-musl
            bin: ralphy
            archive: tar.gz
          # Built natively on the ARM runner, static musl for the same reason as
          # linux-x64. `ralphy host install` sends it to an ARM64 Linux host.
          - os: ubuntu-24.04-arm
            target_name: linux-arm64
            target: aarch64-unknown-linux-musl
            bin: ralphy
            archive: tar.gz
          # Both macOS arches build on the Apple Silicon runner (macos-15): arm64
          # natively, x86_64 by cross-compile (Apple clang cross-compiles out of
          # the box, no extra deps). This avoids the scarce/retiring macos-13 Intel
          # runner, whose queue stalls the whole release.
          # MACOSX_DEPLOYMENT_TARGET=12.0 floors compatibility at macOS 12 Monterey.
          # GitHub retired the macos-14 image (2026-11): a job on it is cancelled at once.
          - os: macos-15
            target_name: macos-x64
            target: x86_64-apple-darwin
            macos_min: "12.0"
            bin: ralphy
            archive: tar.gz
          - os: macos-15
            target_name: macos-arm64
            target: aarch64-apple-darwin
            macos_min: "12.0"
            bin: ralphy
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl build tools
        if: runner.os == 'Linux'
        # musl-gcc, picked up by cc-rs to compile the bundled C deps (sqlite, ring)
        # against musl.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # No cargo cache in this workflow. A published binary is built from a
      # clean tree only, so a cache written by another run cannot reach it
      # (zizmor `cache-poisoning`).
      - name: Build release binary
        # MACOSX_DEPLOYMENT_TARGET is read by the Apple linker to set the binary's
        # minimum-OS load command; empty (and so ignored) on Windows/Linux.
        # CC_<target> points cc-rs at the wrapper Ubuntu's musl-tools actually
        # installs (`musl-gcc`), not the prefixed name cc-rs probes by default
        # (`x86_64-linux-musl-gcc`), so the bundled C deps (sqlite, ring)
        # compile. Ignored on the Windows/macOS targets.
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --bin ralphy --target ${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ralphy-$version-${{ matrix.target_name }}" >> "$GITHUB_OUTPUT"

      - name: Package archive
        shell: bash
        # The name comes from the tag, so it reaches the shell as an environment
        # variable, never as an expression inside the script.
        env:
          NAME: ${{ steps.version.outputs.name }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="$NAME"
          stage="dist/$name"
          mkdir -p "$stage" out
          # The binary embeds its prompts and skills at build time, so it is
          # self-contained — these are the docs a user needs alongside it.
          cp "target/$TARGET/release/$BIN" "$stage/"
          cp README.md LICENSE docs/BUILDING.md "$stage/"
          if [[ "$ARCHIVE" == "zip" ]]; then
            ( cd dist && 7z a -tzip "../out/$name.zip" "$name" >/dev/null )
            archive="$name.zip"
          else
            # tar preserves the executable bit so the user can run it directly.
            tar -czf "out/$name.tar.gz" -C dist "$name"
            archive="$name.tar.gz"
          fi
          # macOS ships `shasum -a 256`, not the `sha256sum` Linux/Windows have;
          # both emit the same `<hash>  <file>` format `sha256sum -c` verifies.
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd out && sha256sum "$archive" > "$archive.sha256" )
          else
            ( cd out && shasum -a 256 "$archive" > "$archive.sha256" )
          fi
          ls -l out

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.target_name }}
          path: out/

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      discussions: write # open the announcement discussion (ADR-0056 §7)
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      # The publish job had no source tree until now: it only downloaded the
      # artifacts. `--notes-file` needs the changelog record the fold committed
      # (ADR-0056 §2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Render the release notes
        # Renders from the committed changelog.json with the same renderer the
        # fold uses, so the workflow never re-implements it against the
        # markdown. An unrecorded version publishes a pointer rather than
        # failing a release whose artifacts are already built.
        run: cargo run --locked -q -p xtask -- changelog --notes "${GITHUB_REF#refs/tags/}"

      - name: Download all packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: out
          merge-multiple: true

      # A signed statement that each archive was built by this workflow from
      # this commit. A user checks it with `gh attestation verify <archive>
      # --repo paulocorcino/ralphy`. The .sha256 files only prove the download
      # is complete, because they come from the same place as the archive.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.zip
            out/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          ls -l out
          # A semver pre-release tag (contains a hyphen, e.g. v0.1.0-rc1) is
          # published as a GitHub pre-release so it is not flagged "Latest".
          prerelease_flag=""
          if [[ "$version" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          # Only a release that carried a feature, a breaking change or a
          # security fix opens a discussion. At one release every few days,
          # announcing all of them trains the audience to ignore all of them
          # (ADR-0056 §7); the flag falls out of the fragments' kinds.
          discussion_flag=""
          if [[ "$(cat target/changelog/announce)" == "yes" ]]; then
            discussion_flag="--discussion-category Announcements"
          fi
          # The structured record rides along as an asset, so the workbench can
          # show what changed across the whole gap. The notes markdown must NOT
          # be in out/ — everything there is uploaded as an asset.
          if [[ -f changelog.json ]]; then
            cp changelog.json out/changelog.json
          fi
          # The announcement is the softer half of the publish: a release that
          # cannot open its discussion — discussions turned off on the repo, the
          # category renamed — must still ship its archives, because the archives
          # are what `ralphy update` resolves. The flagged attempt therefore falls
          # back to an unannounced release rather than taking the release down.
          # The flags stay unquoted: an empty one must not reach `gh` as an
          # empty argument.
          # shellcheck disable=SC2086
          if [[ -n "$discussion_flag" ]]; then
            if gh release create "$version" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$version" \
              --notes-file target/changelog/notes.md \
              $prerelease_flag \
              $discussion_flag; then
              exit 0
            fi
            if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::warning::the announcement discussion failed; the release itself is published"
              exit 0
            fi
            echo "::warning::the announcement discussion failed; publishing the release without one"
          fi
          gh release create "$version" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file target/changelog/notes.md \
            $prerelease_flag
