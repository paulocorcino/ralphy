name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt · clippy
    # Formatting and lints are platform-independent, so run them once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: build · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A wedged test used to consume the whole job budget until the hosted
    # runner died ("lost communication"), which uploads no log at all. Bound
    # the job so a hang fails fast, inside the step, with a log that survives.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # `cargo test` runs one test binary at a time, and this workspace has ~50;
      # nextest schedules every test across one pool instead. It does not run
      # doctests, hence the separate `--doc` step below.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --workspace --release

      # The Linux hang has the same signature as memory or disk exhaustion, so
      # sample both alongside the tests. The sampler runs inside the Test step
      # because a job killed by `timeout-minutes` cancels later steps: only the
      # log of the step that was running survives.
      - name: Test
        if: runner.os == 'Linux'
        # PTY tests drive sh on Linux (portable-pty).
        run: |
          ( while true; do
              echo "--- resources $(date -u +%H:%M:%S) ---"
              free -m | head -2
              df -h / | tail -1
              sleep 60
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null' EXIT
          cargo nextest run --workspace --release

      - name: Test
        if: runner.os == 'Windows'
        # PTY tests drive cmd.exe on Windows (portable-pty).
        run: cargo nextest run --workspace --release

      # Nextest cannot run doctests. The workspace has none today, so this is a
      # cheap backstop that keeps the gate honest the day someone adds one.
      - name: Doctests
        run: cargo test --workspace --release --doc
