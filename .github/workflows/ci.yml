name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The oxlint of the `ui-tests` job. The lint steps of `xtask gate` run
  # the same version through npx locally, and the ratchet
  # `ci_installs_the_pinned_oxlint` fails when the two differ.
  OXLINT_VERSION: "1.93.0"
  OXLINT_SHA256: 6d0d37cb51d01449714f04e2dff0d87dca66c39a72544f667b29808899d2db39
  # The tools of the `checks` job: release binaries, pinned like oxlint. The
  # local forms, with `cargo install --locked --version`, are in AGENTS.md.
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  MACHETE_VERSION: "0.9.2"
  MACHETE_SHA256: 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9
  TYPOS_VERSION: "1.51.1"
  TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454
  # The tsgolint of the type-aware run of the `ui-tests` job: the npm tarball
  # of @oxlint-tsgolint/linux-x64. The type-aware step of `xtask gate` runs
  # the same version through npx, and `ci_installs_the_pinned_tsgolint`
  # fails when the two differ.
  TSGOLINT_VERSION: "7.0.2006"
  TSGOLINT_SHA256: 85cfff1e15e5b209c904d3daef6c4595ee544ecc9a274c8fccb271a92177c155
  # The oxfmt of the format check of the `ui-tests` job. The format step
  # of `xtask gate` runs the same version through npx, and
  # `ci_installs_the_pinned_oxfmt` fails when the two differ. A new version
  # is its own reformat commit.
  OXFMT_VERSION: "0.75.0"
  OXFMT_SHA256: 6a111e38ab6edfe61b87deffbc95e461e3b7326d5d034bdee71ba92cdfd87641
  # The ast-grep of the `checks` job: the rules that read the shape of the code
  # (sgconfig.yml). The ast-grep steps of `xtask gate` run the same version
  # through npx, and `ci_installs_the_pinned_ast_grep` fails when the two differ.
  ASTGREP_VERSION: "0.51.1"
  ASTGREP_SHA256: 42514f77ae0c8a25d7d32154d31d3e7e16f3ab894f8ce76ce417de234ee49157
  # The shellcheck of the `checks` job: a release binary, pinned like actionlint.
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  # The PSScriptAnalyzer module of the `checks` job, installed from the
  # PowerShell Gallery at this version. The step of `xtask gate` runs the
  # module installed on the machine.
  PSSCRIPTANALYZER_VERSION: "1.25.0"
  # The markdownlint-cli2 of the `checks` job. The markdownlint step of
  # `xtask gate` runs the same version through npx, and
  # `ci_installs_the_pinned_markdownlint` fails when the two differ.
  MARKDOWNLINT_VERSION: "0.18.1"
  # The yamllint of the `checks` job. The yamllint step of `xtask gate`
  # runs the module installed on the machine.
  YAMLLINT_VERSION: "1.38.0"
  # The html-validate of the `checks` job. The html-validate step of
  # `xtask gate` runs the same version through npx.
  HTMLVALIDATE_VERSION: "11.21.0"

jobs:
  lint:
    name: fmt · clippy
    # Formatting and lints are platform-independent, so run them once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # The workbench text follows ADR-0065. The rules are in
      # docs/ui-copy-rules.json; a violation or a stale exemption fails the job.
      - name: UI copy (ADR-0065)
        run: cargo run --locked -q -p xtask -- ui-copy --check

      # The ratchets and fitness functions of docs/ARCHITECTURE.md §8 that live
      # in crates/xtask/tests. They read the source tree and build no product
      # crate, so they stay on a pull request. The product is built and tested
      # in release.yml, before the packages.
      - name: Ratchets (xtask tests)
        run: cargo test --locked -q -p xtask

  checks:
    name: actionlint · machete · typos · doc
    # Checks that no test makes: a mistake in a workflow, a dependency that no
    # code uses, a typo, and a doc comment whose link or markup is wrong. They
    # do not depend on the platform, so they run once on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Reads the workflows, and runs shellcheck over their `run:` steps.
      - name: Workflows (actionlint)
        run: |
          ./.github/scripts/fetch-actionlint.sh
          ./actionlint

      # The release binary, pinned by version and checksum. The scripts are the
      # files git tracks, which `.gitattributes` checks out with LF line ends.
      - name: Shell scripts (shellcheck)
        run: |
          ./.github/scripts/fetch-shellcheck.sh
          git ls-files -z '*.sh' | xargs -0 ./shellcheck

      # Each tracked script is checked alone. The rules are in
      # PSScriptAnalyzerSettings.psd1.
      - name: PowerShell scripts (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
          $found = 0
          foreach ($file in git ls-files '*.ps1') {
            $result = Invoke-ScriptAnalyzer -Path $file -Settings PSScriptAnalyzerSettings.psd1
            $result | Format-List
            $found += ($result | Measure-Object).Count
          }
          if ($found -gt 0) { exit 1 }

      # The rules are in .markdownlint-cli2.jsonc; a rule with sites left is
      # off there and has a debt line.
      - name: Markdown (markdownlint)
        run: npx -y "markdownlint-cli2@${MARKDOWNLINT_VERSION}"

      # The rules are in .yamllint.yml; a rule with sites left is off there
      # and has a debt line.
      - name: YAML (yamllint)
        run: pipx run "yamllint==${YAMLLINT_VERSION}" -s .

      # The rules are in .htmlvalidate.json; their reasons and debt counts
      # are at the html-validate step of crates/xtask/src/gate/steps.rs.
      - name: HTML (html-validate)
        run: npx -y "html-validate@${HTMLVALIDATE_VERSION}" crates/ralphy-daemon/assets/ui

      # A dependency in a Cargo.toml that no source file names. The binary
      # sits in the working directory, so `cargo machete` finds it on PATH.
      - name: Unused dependencies (cargo machete)
        run: |
          ./.github/scripts/fetch-cargo-machete.sh
          PATH="$PWD:$PATH" cargo machete

      # The words to accept are in _typos.toml.
      - name: Spelling (typos)
        run: |
          ./.github/scripts/fetch-typos.sh
          ./typos

      # The rules in ast-grep/rules; a suppression that hides nothing fails.
      - name: Rules by shape (ast-grep)
        run: |
          ./.github/scripts/fetch-ast-grep.sh
          ./ast-grep-bin/ast-grep scan --error=unused-suppression

      # Each rule refuses its `invalid` cases and lets its `valid` ones through.
      - name: Rule tests (ast-grep)
        run: ./ast-grep-bin/ast-grep test --skip-snapshot-tests

      # A broken intra-doc link or bad markup in a doc comment is a warning
      # that rustdoc prints and the build does not fail on.
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  ui-tests:
    name: ui-tests
    # The workbench's JS is tested by `node --test` against the real sources in
    # assets/ui, with no DOM and no dependencies — so, like the lint job, it is
    # platform-independent and runs once. It was red for a week before this job
    # existed, across eight commits that edited the suite: a gate nobody runs is
    # not a gate.
    runs-on: ubuntu-latest
    # The suite's own documented hazard is a HANG, not a failure: an undeleted
    # `BroadcastChannel` holds the event loop open and `node --test` never exits
    # (ui-tests/harness.mjs). Unbounded, that burns the default six hours and
    # uploads no log.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # No install step on purpose: ui-tests/package.json declares no
      # dependencies, and the suite imports only node:test and node:assert.
      # Node 22.18 and later run the `.ts` modules by removing their types.
      - name: UI tests
        run: node --test crates/ralphy-daemon/ui-tests

      # The type check of the workbench modules (ADR-0075 D4), pinned like
      # jscpd below. Nothing is installed in the repository; tsc reads
      # crates/ralphy-daemon/assets/ui/tsconfig.json.
      - name: UI type check (tsc)
        run: npx -y -p typescript@7.0.2 tsc --noEmit -p crates/ralphy-daemon/assets/ui

      # The release binary, pinned by version and checksum, so the workbench
      # still needs no npm install (ADR-0057 D3). Rules: .oxlintrc.json.
      - name: UI lint (oxlint)
        run: |
          ./.github/scripts/fetch-oxlint.sh
          ./oxlint-x86_64-unknown-linux-gnu --deny-warnings crates/ralphy-daemon/assets/ui crates/ralphy-daemon/ui-tests

      # The rules that read the types, run by tsgolint over the modules by
      # name: these are the files tsconfig.json type-checks. The tests are
      # not type-checked, so the rules are not run on them.
      - name: UI type-aware lint (oxlint with tsgolint)
        run: |
          ./.github/scripts/fetch-tsgolint.sh
          OXLINT_TSGOLINT_PATH="$PWD/tsgolint" ./oxlint-x86_64-unknown-linux-gnu --type-aware --deny-warnings crates/ralphy-daemon/assets/ui/*.ts

      # The format of the modules, in .oxfmtrc.json. The release binary is
      # pinned by version and checksum, as for oxlint.
      - name: UI format (oxfmt)
        run: |
          ./.github/scripts/fetch-oxfmt.sh
          ./oxfmt-x86_64-unknown-linux-gnu --check crates/ralphy-daemon/assets/ui/*.ts

  changelog:
    name: changelog fragment
    # Pull requests only: a fragment is written in the pull request, so there is
    # nothing to require on a push to main (ADR-0056 §3).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate diffs against the base, which a depth-1 clone cannot reach.
          fetch-depth: 0
          # Nothing may re-fetch the base shallowly afterwards: a `--depth=1`
          # fetch writes a .git/shallow boundary at its tip and `A...B` then
          # fails with "no merge base" on every branch whose base has moved.

      - name: Changed files
        id: changed
        # A branch name is text from outside the workflow: it reaches the shell
        # as an environment variable, never as an expression inside the script.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          files="$(git diff --name-only "$base"...HEAD)"
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: A user-visible change carries a fragment
        env:
          # Read straight off the event payload: no API call, no token.
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail

          if printf '%s' "$LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
            echo "labelled no-changelog — a human took this call"
            exit 0
          fi

          # The shipped surface. The UI assets are in this list on purpose: most
          # user-visible workbench work lands there and not under crates/*/src,
          # so a source-only filter would gate almost nothing (ADR-0056 §3).
          shipped="$(printf '%s\n' "$FILES" | grep -E '^crates/[^/]+/src/|^crates/ralphy-daemon/assets/ui/|^assets/' || true)"
          if [ -z "$shipped" ]; then
            echo "no change to the shipped surface"
            exit 0
          fi

          fragments="$(printf '%s\n' "$FILES" | grep -E '^changelog\.d/[^/]+\.md$' | grep -v '^changelog\.d/README\.md$' || true)"
          if [ -z "$fragments" ]; then
            echo "::error::this pull request changes the shipped surface but carries no changelog fragment."
            echo ""
            echo "Add changelog.d/<pr-number>.md — see changelog.d/README.md."
            echo "A change nobody can see takes 'kind: internal'."
            echo "A human can override with the no-changelog label."
            echo ""
            echo "Changed on the shipped surface:"
            printf '%s\n' "$shipped" | sed 's/^/  /'
            exit 1
          fi

          echo "fragments present:"
          printf '%s\n' "$fragments" | sed 's/^/  /'

      - name: The fragments parse
        run: cargo run --locked -q -p xtask -- changelog --check

  duplication:
    name: no new duplicated code
    # Fails when the pull request adds a clone (.jscpd.json: 100 tokens over
    # 10 lines, test files excluded) that the base branch does not have. A
    # clone the pull request edits counts as new too: the fingerprint is the
    # fragment's text, so an edit inside an old clone changes it (measured
    # with jscpd 5.4.0, 2026-10-04).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # jscpd scans the base ref's tree, which a depth-1 clone does not have.
          fetch-depth: 0

      # The release binary, pinned by version and checksum, as for oxlint.
      - name: No new clone against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          JSCPD_VERSION: "5.4.0"
          JSCPD_SHA256: 4c2819a5663e5418fe5dcf0faceca7f05c1f080d3c87fd57cc4ccf99ce857194
        run: |
          set -euo pipefail
          curl -sSLf -o jscpd.tar.gz "https://github.com/kucherenko/jscpd/releases/download/v${JSCPD_VERSION}/jscpd-linux-x64-gnu.tar.gz"
          echo "${JSCPD_SHA256}  jscpd.tar.gz" | sha256sum --check
          tar xzf jscpd.tar.gz jscpd
          ./jscpd --baseline-from-ref "origin/$BASE_REF" --fail-on-new-clones 0 crates

  lint-transition:
    name: lint debt
    # The lint transition (docs/lint/lint-transition.md): each debt list only
    # shrinks, the lines a pull request adds meet the whole target (the drafts
    # in docs/lint/lint-drafts), and the plan's record matches the plan.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The checks compare with the merge base, which a depth-1 clone lacks.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Debt lists only shrink
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 docs/lint/gate.py shrink --base "origin/$BASE_REF"

      - name: New lines meet the lint target
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 docs/lint/gate.py added --base "origin/$BASE_REF"

      - name: The lint plan matches its record
        run: python3 docs/lint/scripts/progress.py check docs/lint/lint-record.json --plan docs/lint/lint-transition.md

  oversized:
    name: no file is over its size or width limit
    # Fails when a source file has more than 500 lines, every line counted
    # (code, comments, blank lines and tests, in Rust, TypeScript and HTML), or
    # a line of Rust or TypeScript has more than 100 characters. An old file
    # has no exception (ADR-0022 §9).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No file or line is over its limit
        run: cargo run --locked -q -p xtask -- oversized --check

  complexity:
    name: no function grows past its complexity limit
    # Fails when a Rust production function scores over 10 and has no
    # `// complexity-exception: <reason>` marker (ADR-0081). The score is its
    # cognitive complexity, read from the source text. The TypeScript limit is
    # oxlint's `complexity` rule, which the `ui-tests` job runs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rust scores come from the source text, not from the compiler, so
      # the toolchain only builds the xtask.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: No Rust function over its complexity limit
        run: cargo run -q --locked -p xtask -- complexity --check
