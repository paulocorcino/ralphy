name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The oxlint of the `ui-tests` job. The oxlint command of AGENTS.md runs
  # the same version through npx locally, and the ratchet
  # `ci_installs_the_pinned_oxlint` fails when the two differ.
  OXLINT_VERSION: "1.85.0"
  OXLINT_SHA256: 39cb1f977613ea1c0d734590e9b9325a959a740cfec702a63df56ee04ce15cc3

jobs:
  lint:
    name: fmt · clippy
    # Formatting and lints are platform-independent, so run them once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The workbench text follows ADR-0065. The rules are in
      # docs/ui-copy-rules.json; a violation or a stale exemption fails the job.
      - name: UI copy (ADR-0065)
        run: cargo run -q -p xtask -- ui-copy --check

  ui-tests:
    name: ui-tests
    # The workbench's JS is tested by `node --test` against the real sources in
    # assets/ui, with no DOM and no dependencies — so, like the lint job, it is
    # platform-independent and runs once. It was red for a week before this job
    # existed, across eight commits that edited the suite: a gate nobody runs is
    # not a gate.
    runs-on: ubuntu-latest
    # The suite's own documented hazard is a HANG, not a failure: an undeleted
    # `BroadcastChannel` holds the event loop open and `node --test` never exits
    # (ui-tests/harness.mjs). Unbounded, that burns the default six hours and
    # uploads no log. The `test` job is bounded for the same reason.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # No install step on purpose: ui-tests/package.json declares no
      # dependencies, and the suite imports only node:test and node:assert.
      # Node 22.18 and later run the `.ts` modules by removing their types.
      - name: UI tests
        run: node --test crates/ralphy-daemon/ui-tests

      # The type check of the workbench modules (ADR-0075 D4), pinned like
      # jscpd below. Nothing is installed in the repository; tsc reads
      # crates/ralphy-daemon/assets/ui/tsconfig.json.
      - name: UI type check (tsc)
        run: npx -y -p typescript@7.0.2 tsc --noEmit -p crates/ralphy-daemon/assets/ui

      # The release binary, pinned by version and checksum, so the workbench
      # still needs no npm install (ADR-0057 D3). Rules: .oxlintrc.json.
      - name: UI lint (oxlint)
        run: |
          ./.github/scripts/fetch-oxlint.sh
          ./oxlint-x86_64-unknown-linux-gnu --deny-warnings crates/ralphy-daemon/assets/ui crates/ralphy-daemon/ui-tests

  test:
    name: build · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A wedged test used to consume the whole job budget until the hosted
    # runner died ("lost communication"), which uploads no log at all. The
    # Test steps carry their own, shorter bound (#441): a job cancelled by
    # this one keeps no log either (`BlobNotFound`).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # macOS joined on 2026-09-16 with the launchd autostart arm (ADR-0032
        # amendment 2026-09-15); its smoke step below is the one place
        # `launchctl` runs for real. Windows is tested in release.yml, before
        # the packages are built: on a pull request it took 15 min and its
        # tests hang at times (#441), and the gate runs locally on Windows.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `cargo test` runs one test binary at a time, and this workspace has ~50;
      # nextest schedules every test across one pool instead. It does not run
      # doctests, hence the separate `--doc` step below.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest

      # `--profile ci` is `release` without its ship-only link cost (Cargo.toml):
      # under `lto`/`codegen-units = 1` the workspace's ~50 test binaries took
      # over 20 minutes to link and the job died on the bound below without
      # running a test. `--all-targets` builds those test binaries here, so the
      # Test step below times tests and a compile blowup can never again read as
      # a test hang.
      - name: Build
        run: cargo build --workspace --profile ci --all-targets

      # The Linux hang has the same signature as memory or disk exhaustion, so
      # sample both alongside the tests. The sampler runs inside the Test step
      # because a step killed by its `timeout-minutes` skips the later steps:
      # only this step's log carries the samples.
      - name: Test
        if: runner.os == 'Linux'
        timeout-minutes: 18
        # PTY tests drive sh on Linux (portable-pty).
        run: |
          ( while true; do
              echo "--- resources $(date -u +%H:%M:%S) ---"
              free -m | head -2
              df -h / | tail -1
              sleep 60
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null' EXIT
          cargo nextest run --workspace --cargo-profile ci --no-fail-fast

      - name: Test
        if: runner.os == 'macOS'
        timeout-minutes: 18
        # PTY tests drive sh on macOS, as on Linux (portable-pty).
        run: cargo nextest run --workspace --cargo-profile ci --no-fail-fast

      # The only place `launchctl` runs for real (ADR-0032, amendment
      # 2026-09-15): a hosted macOS runner is a logged-in GUI session, so the
      # `gui/$UID` domain the agent bootstraps into exists. Proves the
      # register → probe → unregister round trip and that a second install is
      # a no-op, which no unit test can. A scratch HOME keeps the runner's own
      # LaunchAgents untouched and the daemon un-baptized, so nothing serves.
      - name: Autostart smoke (launchd)
        if: runner.os == 'macOS'
        env:
          HOME: ${{ runner.temp }}/ralphy-home
        run: |
          set -euxo pipefail
          mkdir -p "$HOME"
          bin=target/ci/ralphy
          "$bin" daemon status | grep -q 'autostart: not registered'
          "$bin" daemon install
          "$bin" daemon install   # a re-install is a no-op, not a bootstrap error
          "$bin" daemon status | grep -q 'autostart: registered'
          test -f "$HOME/Library/LaunchAgents/dev.ralphy.daemon.plist"
          "$bin" daemon uninstall
          "$bin" daemon uninstall # idempotent
          "$bin" daemon status | grep -q 'autostart: not registered'
          test ! -e "$HOME/Library/LaunchAgents/dev.ralphy.daemon.plist"

      # Nextest cannot run doctests. The workspace has none today, so this is a
      # cheap backstop that keeps the gate honest the day someone adds one.
      - name: Doctests
        run: cargo test --workspace --profile ci --doc

  install-scripts:
    name: install scripts (${{ matrix.os }})
    # The one-line install (ADR-0056 §12) runs against a fake release packed
    # from this commit's binary and served on loopback, so no real release is
    # read. The scripts themselves are what `main` serves to users.
    # install.ps1 is checked in release.yml, with the Windows tests.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --bin ralphy

      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck assets/install/install.sh

      # The server runs in the same step as the script: a background process
      # does not reliably outlive its step. Each refusal is checked by its
      # message, so an unrelated failure does not pass for it.
      - name: install.sh
        env:
          RALPHY_RELEASES_URL: http://127.0.0.1:8765/releases
          RALPHY_DOWNLOAD_URL: http://127.0.0.1:8765/download
          RALPHY_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          set -eux
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=linux-x64 ;;
            Darwin-arm64) target=macos-arm64 ;;
            Darwin-x86_64) target=macos-x64 ;;
          esac
          python3 .github/scripts/install-fixture.py target/debug/ralphy "$target" "$RUNNER_TEMP/release"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/release" >/dev/null 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null "$RALPHY_RELEASES_URL" && break
            sleep 0.2
          done
          sh assets/install/install.sh
          "$RALPHY_INSTALL_DIR/ralphy" --version
          sh assets/install/install.sh   # a second run repairs the install
          # The default folder, decided by the binary: a scratch home has no
          # ~/.cargo/bin, so it is ~/.local/bin.
          ( export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"; unset RALPHY_INSTALL_DIR
            sh assets/install/install.sh
            "$HOME/.local/bin/ralphy" --version )
          if [ "$(uname -s)" = Darwin ]; then
            # The daemon at sign-in: a launchd agent in a scratch home.
            ( export HOME="$RUNNER_TEMP/daemon-home"; mkdir -p "$HOME"
              RALPHY_DAEMON=1 sh assets/install/install.sh
              test -f "$HOME/Library/LaunchAgents/dev.ralphy.daemon.plist"
              "$RALPHY_INSTALL_DIR/ralphy" daemon uninstall )
          fi
          if [ "$(uname -s)" = Linux ]; then
            # As root with no terminal, it stops unless root is allowed.
            if sudo -E setsid -w sh assets/install/install.sh </dev/null 2>"$RUNNER_TEMP/root.err"; then
              echo "install.sh ran as root with no terminal and no RALPHY_ALLOW_ROOT"
              exit 1
            fi
            grep -q "no terminal to ask in" "$RUNNER_TEMP/root.err"
            sudo -E env RALPHY_ALLOW_ROOT=1 RALPHY_INSTALL_DIR="$RUNNER_TEMP/rootbin" \
              setsid -w sh assets/install/install.sh </dev/null
            "$RUNNER_TEMP/rootbin/ralphy" --version
          fi
          # A wrong checksum installs nothing.
          sum="$RUNNER_TEMP/release/download/v0.0.0-fixture/ralphy-v0.0.0-fixture-$target.tar.gz.sha256"
          echo "0000  x" > "$sum"
          if RALPHY_INSTALL_DIR="$RUNNER_TEMP/badbin" sh assets/install/install.sh 2>"$RUNNER_TEMP/sum.err"; then
            echo "install.sh accepted a wrong checksum"
            exit 1
          fi
          grep -q "SHA-256 of" "$RUNNER_TEMP/sum.err"
          test ! -e "$RUNNER_TEMP/badbin/ralphy"

  changelog:
    name: changelog fragment
    # Pull requests only: a fragment is written in the pull request, so there is
    # nothing to require on a push to main (ADR-0056 §3).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate diffs against the base, which a depth-1 clone cannot reach.
          fetch-depth: 0
          # Nothing may re-fetch the base shallowly afterwards: a `--depth=1`
          # fetch writes a .git/shallow boundary at its tip and `A...B` then
          # fails with "no merge base" on every branch whose base has moved.

      - name: Changed files
        id: changed
        # A branch name is text from outside the workflow: it reaches the shell
        # as an environment variable, never as an expression inside the script.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          files="$(git diff --name-only "$base"...HEAD)"
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: A user-visible change carries a fragment
        env:
          # Read straight off the event payload: no API call, no token.
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail

          if printf '%s' "$LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
            echo "labelled no-changelog — a human took this call"
            exit 0
          fi

          # The shipped surface. The UI assets are in this list on purpose: most
          # user-visible workbench work lands there and not under crates/*/src,
          # so a source-only filter would gate almost nothing (ADR-0056 §3).
          shipped="$(printf '%s\n' "$FILES" | grep -E '^crates/[^/]+/src/|^crates/ralphy-daemon/assets/ui/|^assets/' || true)"
          if [ -z "$shipped" ]; then
            echo "no change to the shipped surface"
            exit 0
          fi

          fragments="$(printf '%s\n' "$FILES" | grep -E '^changelog\.d/[^/]+\.md$' | grep -v '^changelog\.d/README\.md$' || true)"
          if [ -z "$fragments" ]; then
            echo "::error::this pull request changes the shipped surface but carries no changelog fragment."
            echo ""
            echo "Add changelog.d/<pr-number>.md — see changelog.d/README.md."
            echo "A change nobody can see takes 'kind: internal'."
            echo "A human can override with the no-changelog label."
            echo ""
            echo "Changed on the shipped surface:"
            printf '%s\n' "$shipped" | sed 's/^/  /'
            exit 1
          fi

          echo "fragments present:"
          printf '%s\n' "$fragments" | sed 's/^/  /'

      - name: The fragments parse
        run: cargo run -q -p xtask -- changelog --check

  duplication:
    name: no new duplicated code
    # Fails when the pull request adds a clone (.jscpd.json: 100 tokens over
    # 10 lines, test files excluded) that the base branch does not have. A
    # clone the pull request edits counts as new too: the fingerprint is the
    # fragment's text, so an edit inside an old clone changes it (measured
    # with jscpd 5.4.0, 2026-10-04).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # jscpd scans the base ref's tree, which a depth-1 clone does not have.
          fetch-depth: 0

      # The release binary, pinned by version and checksum, as for oxlint.
      - name: No new clone against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          JSCPD_VERSION: "5.4.0"
          JSCPD_SHA256: 4c2819a5663e5418fe5dcf0faceca7f05c1f080d3c87fd57cc4ccf99ce857194
        run: |
          set -euo pipefail
          curl -sSLf -o jscpd.tar.gz "https://github.com/kucherenko/jscpd/releases/download/v${JSCPD_VERSION}/jscpd-linux-x64-gnu.tar.gz"
          echo "${JSCPD_SHA256}  jscpd.tar.gz" | sha256sum --check
          tar xzf jscpd.tar.gz jscpd
          ./jscpd --baseline-from-ref "origin/$BASE_REF" --fail-on-new-clones 0 crates

  oversized:
    name: no file grows past its size limit
    # Fails when a source file over its limit (500 lines of code in Rust,
    # TypeScript and HTML; comments and blank lines do not count) is larger than on
    # the base branch: a new file, a file that grows past the limit, or an old
    # large file that grows. An old large file may shrink (ADR-0022 §7). Fails
    # too when a Rust file has more lines over 100 characters than on the base
    # branch (ADR-0022 §8).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sizes on the base need history a depth-1 clone does not have.
          fetch-depth: 0

      - name: No file over its limit grows against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo run -q -p xtask -- oversized --base "origin/$BASE_REF"

  complexity:
    name: no function grows past its complexity limit
    # Fails when a Rust production function scores over 10 and has no
    # `// complexity-exception: <reason>` marker (ADR-0081). The score is its
    # cognitive complexity, read from the source text. The TypeScript limit is
    # oxlint's `complexity` rule, which the `ui-tests` job runs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rust scores come from the source text, not from the compiler, so
      # the toolchain only builds the xtask.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: No Rust function over its complexity limit
        run: cargo run -q --locked -p xtask -- complexity --check
