# Weekly update pull requests for crates and for the pinned workflow actions.
# A security update opens at once, outside this schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A new release waits a few days before it is proposed, so a compromised
    # release has time to be found and yanked.
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    # These versions need code changes or a live check first (#443). Use a version range here,
    # not `@dependabot ignore this major version`: on a 0.x crate that command
    # ignores every 0.x version, fixes included.
    ignore:
      - dependency-name: hmac
        versions: [">=0.13"]
      - dependency-name: zip
        versions: [">=3"]
      - dependency-name: getrandom
        versions: [">=0.3"]
      - dependency-name: sha1
        versions: [">=0.11"]
      - dependency-name: rusqlite
        versions: [">=0.32"]
      - dependency-name: ureq
        versions: [">=3"]
      - dependency-name: sha2
        versions: [">=0.11"]
      - dependency-name: pbkdf2
        versions: [">=0.13"]
      - dependency-name: ulid
        versions: [">=2"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
